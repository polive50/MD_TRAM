# Información arquetipo
VERSION_ARQUETIPO=2.1.0
TIPO_ARQUETIPO=web
APP_CONTEXT_NAME=ApplicationContextSaiiTramitacion

# Propiedades preestablecidas de la generación de código
ENTIDADES_SOLO_LECTURA=false
FORMULARIOS_POPUP=false

# PK de tablas con clave compuesta o no definida
# PK_XXXX=

# Extensión de campos blob por tabla-columna
# BLOB_EXT_XXXX=

# Indica que una tabla es el mapeo de una relación N:M
# ENTIDAD_MANY_TO_MANY_XXXXXX=TABLA_1,TABLA_2

# Propiedades de auditoría para la tabla XXXX
# AUDITORIA_USUALTA_XXXX=NOMBRE_CAMPO1
# AUDITORIA_FECHAALTA_XXXX = NOMBRE_CAMPO2
# AUDITORIA_USUMODIF_XXXX = NOMBRE_CAMPO3 
# AUDITORIA_FECHAMODIF_XXXX = NOMBRE_CAMPO4
# AUDITORIA_USUBAJA_XXXX= NOMBRE_CAMPO5
# AUDITORIA_FECHABAJA_XXXX= NOMBRE_CAMPO6

# Propiedades opcionales de la generación de código 
# ENTIDAD_NEGOCIO_XXXX=true/false (una fila por cada entidad)
# ENTIDAD_FORMULARIO_POPUP_XXXX=true/false (una fila por cada entidad que se quiera especificar)
# ENTIDAD_TABLA_XXXX=NombreEntidadDeseado (una fila por cada entidad que se quiera especificar)
# ENTIDAD_SOLO_LECTURA_XXXX=true/false (una fila por cada entidad que se quiera especificar)
# LIMITAR_CAMPOS_DTO_XXXX=true/false (una fila por cada entidad que se quiera especificar)
# GENERAR_SOLO_DOMINIO_XXXX=true/false