<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">
    
    <atlasp:guardarEstado value="#{convocatoriasBean.itAlegacion}" />
    <atlasp:guardarEstado value="#{expedienteBean.cadenaNotaMaxima}" />
    <atlasp:guardarEstado value="#{solicitudBean.tablaSeleccionada}" />
    <!-- MD-1593 JRFM Ya no es necesario guardar el listado de expedientes -->
    <!-- <atlasp:guardarEstado value="#{solicitudBean.lstExpedientes}" /> -->

    <!-- Inclusión de los ficheros js y css necesarios para la subida de ficheros -->
    <h:outputStylesheet library="atlas.core.css"
        name="plupload_atlas.css" />
    <h:outputScript library="atlas.core.js" name="plupload.full.min.js" />
    <h:outputScript library="atlas.core.js" name="plupload_atlas.js" />

    <p:panelGrid id="outpanelRevisionSolapa" columns="1" 
        columnClasses="ui-g-12" layout="grid" styleClass="ui-panelgrid-blank">
        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.expedienteSeleccionado.titulo']}" />

        <p:column>
            <div class="ui-g">
                <!-- Código de expediente -->
                <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                    <h:outputLabel for="cdExpedienteSel"
                        styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.cdExpediente']}" />
                </div>
                <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
                    <p:inputText id="cdExpedienteSel"
                        readonly="true"
                        value="#{expedienteBean.expedienteDTO.cdExpediente}" />
                </div>
                <!-- Estado de expediente -->
                <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                    <h:outputLabel for="dsEstadoExpedienteSel"
                        styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.estado']}" />
                </div>
                <div class="ui-g-12 ui-md-4 ui-lg-7 ui-xl-7">
                    <p:inputText id="dsEstadoExpedienteSel"
                        readonly="true"
                        value="#{expedienteBean.expedienteDTO.estadoDTO.dsValor}" />
                </div>
            </div>
        </p:column>

        <p:tabView id="contenedorRevisionSolapas"
            widgetVar="contenedorRevisionSolapas"
            activeIndex="#{expedienteBean.pestanaRevisionActiva}"
            dynamic="true" cache="false" scrollable="true" switchType="ajax">
            
            <p:tab id="solapaDatos"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaDatos.xhtml" />
            </p:tab>
            
              <p:tab id="solapaRequisitos"
                rendered="#{expedienteBean.mostrarSolapaRequisitos()}"
                titleStyleClass="#{ expedienteBean.expedienteDTO.BAvisoRequisitos and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.requisitos.label.requisitos']}"
                disabled="#{convocatoriasBean.convocatoriaDTO.itRequisitos == 'N'}">
                <ui:include
                    src="/secure/convocatoria/include/solapaRequisitos.xhtml" />
            </p:tab>
            
            <p:tab id="solapaDocumentos"
                rendered="#{expedienteBean.mostrarSolapaDocumentosConcesion()}" 
                titleStyleClass="#{expedienteBean.expedienteDTO.BAvisoDocumento and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.documentos']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaDocumentos.xhtml" />
            </p:tab>
          


            <p:tab id="solapaEvaluacion"
                rendered="#{expedienteBean.mostrarSolapaEvaluacion()}"
                titleStyleClass="#{ expedienteBean.expedienteDTO.BAvisoEvaluacion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.evaluacion.label.evaluacion']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaEvaluacion.xhtml" />
            </p:tab>

            <p:tab id="solapaFinanciacion"
                rendered="#{ (expedienteBean.expedienteDTO.esExpedienteSolicitante and convocatoriasBean.convocatoriaDTO.idTipoConcesion.nmConstante != 1763) 
                || ((expedienteBean.expedienteDTO.esExpedienteParticipante || expedienteBean.expedienteDTO.esExpedienteCoordinador)  and convocatoriasBean.convocatoriaDTO.idTipoConcesion.nmConstante == 1763)}"
                titleStyleClass="#{ financiacionBean.BAvisoFinanciacion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"            
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.financiacion.label.financiacion']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaFinanciacion.xhtml" />
            </p:tab>
            
<!--             <p:tab id="solapaResolucion" -->
<!--                 rendered="#{expedienteBean.mostrarSolapaResolucion()}" -->
<!--                 titleStyleClass="#{expedienteBean.expedienteDTO.BAvisoResolucion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }" -->
<!--                 title="#{bundle['convocatorias.detalle.solicitudes.expedientes.resolucion.label.resolucion']}"> -->
<!--                 <ui:include -->
<!--                     src="/secure/convocatoria/include/solapaResolucion.xhtml" /> -->
<!--             </p:tab> -->
            
           <!-- 1. Modalidad CONJUNTA ('C'): Muestra la pestaña tradicional de Resolución -->
            <p:tab id="solapaResolucion"
                rendered="#{expedienteBean.mostrarSolapaResolucion() and convocatoriasBean.convocatoriaDTO.tipoResolModalidadDTO.cdTipoResolucion == 'I'}"
                titleStyleClass="#{expedienteBean.expedienteDTO.BAvisoResolucion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.resolucion.label.resolucion']}">
                
                <ui:include src="/secure/convocatoria/include/solapaResolucion.xhtml" />
            </p:tab>

            <!-- 2. Modalidad INDIVIDUAL ('I'): Muestra la pestaña de Trámite de Audiencia -->
            <p:tab id="solapaTramiteAudiencia"
                rendered="#{expedienteBean.mostrarSolapaResolucion() and convocatoriasBean.convocatoriaDTO.tipoResolModalidadDTO.cdTipoResolucion == 'C'}"
                titleStyleClass="#{expedienteBean.expedienteDTO.BAvisoResolucion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.resolucion.label.resolucion']}">
                
                <ui:include src="/secure/convocatoria/include/solapaTramiteAudiencia.xhtml" />
            </p:tab>
            
            
            
            <p:tab id="solapaRevisionContratos"
                        title="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes']}"
                        rendered="#{expedienteBean.expedienteDTO.esExpedienteSolicitante or expedienteBean.expedienteDTO.esExpedienteCoordinador}"
                        titleStyleClass="#{ expedienteBean.expedienteDTO.BAvisoContratos and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                        disabled="#{!expedienteBean.activarPestanaRevContrato}">
                        <ui:include src="/secure/convocatoria/include/solapaRevisionContratos.xhtml" />
            </p:tab>

            <p:tab id="solapaContrato"
                rendered="#{((expedienteBean.expedienteDTO.expedienteContrato != null and expedienteBean.expedienteDTO.expedienteContrato.idExpediente != null)
                or (expedienteBean.expedienteDTO.expedienteContratoSustitucion != null and expedienteBean.expedienteDTO.expedienteContratoSustitucion.idExpediente != null))
                                and !expedienteBean.expedienteDTO.esExpedienteSolicitante}"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.contrato.label.contrato']}"
                disabled="#{!convocatoriasBean.convocatoriaDTO.esConvocatoriaContrato || !expedienteBean.activarPestanaContrato}">
                <ui:include
                    src="/secure/convocatoria/include/solapaContrato.xhtml" />
            </p:tab>
            
            <p:tab id="solapaAnualidades"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.justificaciones.titulo']}"
                rendered="#{(expedienteBean.expedienteDTO.esExpedienteSolicitante or expedienteBean.expedienteDTO.esExpedienteCoordinador) and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 247
                            and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 222}" >
                <ui:include
                    src="/secure/convocatoria/include/solapaAnualidades.xhtml" />
            </p:tab>
            
            <p:tab id="solapaJusTec"
                rendered="#{expedienteBean.mostrarSolapaSubsanacion()}"
                titleStyleClass="#{ expedienteBean.expedienteDTO.BAvisoJustificacion and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.justec.label.justec']}"
                disabled="#{ (convocatoriasBean.convocatoriaDTO.tipoResolModalidadDTO.cdTipoResolucion == 'C' and 
                                            (convocatoriasBean.convocatoriaDTO.idEstado.nmConstante != 152 or expedienteBean.expedienteDTO.estadoDTO.nmConstante != 223))
                            or (convocatoriasBean.convocatoriaDTO.tipoResolModalidadDTO.cdTipoResolucion == 'I' and  expedienteBean.expedienteDTO.estadoDTO.nmConstante != 223 
                                and expedienteBean.expedienteDTO.impresoDTO.tipoDTO.nmConstante != 85)}">
                <ui:include
                    src="/secure/convocatoria/include/solapaJustificacionCieTec.xhtml" />
            </p:tab>
            
             <p:tab id="solapaEvalJusTec"
                rendered="#{expedienteBean.expedienteDTO.esExpedienteSolicitante or expedienteBean.expedienteDTO.esExpedienteCoordinador}"
                titleStyleClass="#{ expedienteBean.activarPestanaRojo ? 'colorRedExpedienteEstados' : '' }"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.justec.label.justevalcietec']}"
                disabled="#{convocatoriasBean.convocatoriaDTO.idEstado.nmConstante != 152 and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 223
                                or expedienteBean.expedienteDTO.estadoDTO.nmConstante == 213 and expedienteBean.expedienteDTO.impresoDTO.tipoDTO.nmConstante != 85}">
                <ui:include
                    src="/secure/convocatoria/include/solapaEvalJusTec.xhtml" />
            </p:tab>
            
            <p:tab id="solapaModifPresPlazoOtra"
                rendered="#{expedienteBean.expedienteDTO.esExpedienteSolicitante and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 247 and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 222}"
                titleStyleClass="#{expedienteModifPresPlazoOtraBean.BAvisoModifPresPlazoOtra and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 213 ? 'colorRedExpedienteEstados' : '' }"            
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.modificacion.label.solapa']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaModifPresPlazoOtra.xhtml" />
            </p:tab>

            <p:tab id="solapaJustificacionEconomica"
                rendered="#{(expedienteBean.expedienteDTO.esExpedienteSolicitante or expedienteBean.expedienteDTO.esExpedienteCoordinador) and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 247
                             and expedienteBean.expedienteDTO.estadoDTO.nmConstante != 222}"
                titleStyleClass="#{ expedienteBean.activarPestanaRojoEco ? 'colorRedExpedienteEstados' : ''}"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.justieco']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaJustificacionEco.xhtml" />
            </p:tab>

            <p:tab id="solapaHistorico"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.historico.label.historico']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaHistorico.xhtml" />
            </p:tab>
            
            <p:tab id="solapaHistoricoTramite"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.historico.label.historico.tramite']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaHistoricoTramite.xhtml" />
            </p:tab>
            
            <p:tab id="solapaHistoricoNotificacion"
                title="#{bundle['convocatorias.detalle.solicitudes.expedientes.historico.label.historico.notificacion']}">
                <ui:include
                    src="/secure/convocatoria/include/solapaHistoricoNotificacion.xhtml" />
            </p:tab>

        </p:tabView>

        <atlasp:button
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.regresarExpedientes']}"
            alt="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.regresarExpedientes']}"
            title="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.regresarExpedientes']}"
            icon="fas fa-chevron-left" 
            tipoBoton="btn-secondary"
            action="#{convocatoriasBean.irASolapaSegunTablaSeleccionada(solicitudBean.tablaSeleccionada)}"
            onclick="atlas.ui.Loading.showLoad('appLoading')"
            oncomplete="atlas.ui.Loading.hideLoad('appLoading')" />
    </p:panelGrid>

</ui:composition>
