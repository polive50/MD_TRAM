<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <atlasp:guardarEstado value="#{convocatoriasBean.entidad}" />
    <atlasp:guardarEstado value="#{convocatoriasBean.modoConsulta}" />
    <atlasp:guardarEstado value="#{convocatoriasBean.convocatoriaDTO}" />

    <atlasp:guardarEstado value="#{solicitudBean.entidad}" />
    <atlasp:guardarEstado value="#{solicitudBean.solicitudDTO}" />
    <atlasp:guardarEstado value="#{solicitudBean.idConvocatoria}" />
    <atlasp:guardarEstado value="#{solicitudBean.idSolicitud}" />
    <atlasp:guardarEstado value="#{solicitudBean.areaCientificaFilter}" />
    <atlasp:guardarEstado value="#{solicitudBean.interesadoFilter}" />
    <atlasp:guardarEstado value="#{convocatoriasBean.itAlegacion}" />
    <!-- MD-1593 JRFM Ya no es necesario guardar el listado de expedientes -->
    <!-- <atlasp:guardarEstado value="#{solicitudBean.lstExpedientes}" /> -->
    <atlasp:guardarEstado value="#{solicitudBean.tablaSeleccionada}" />
    <!-- VMM 27/01/26 MD-2395: pasamos el valor del flag por aqui para no perderlo al cambiar de solicitudes a expedientes -->
    <atlasp:guardarEstado value="#{solicitudBean.mostrarIniciadas}" />

    <div class="ui-g-12 ui-md-12 ui-lg-12">

        <p:outputPanel id="outpanelConvocatoriaSeleccionadaTitulo">
            <h:outputText styleClass="tituloFormulario"
                value="#{bundle['convocatorias.detalle.solicitudes.label.convocatoriaSeleccionada.titulo']}" />
        </p:outputPanel>

        <p:outputPanel id="outpanelConvocatoriaSeleccionada">
            <!-- Acronimo -->
            <div class="ui-g-12 ui-md-12 ui-lg-12">
                <div class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1">
                    <h:outputLabel for="cdAcronimo" styleClass="label"
                        value="#{bundle['convocatorias.label.acronimo']}" />
                </div>
                <div class="ui-g-12 ui-md-3 ui-lg-3 ui-xl-2">
                    <p:inputText id="cdAcronimo"
                        readonly="#{facesContext.renderResponse}"
                        value="#{convocatoriasBean.convocatoriaDTO.cdAcronimo}" />
                </div>
            </div>
            <!-- Descripcion -->
            <div class="ui-g-12 ui-md-12 ui-lg-12">
                <div class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1">
                    <h:outputLabel for="dsDescripcion"
                        styleClass="label"
                        value="#{bundle['convocatorias.label.descripcion']}" />
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11">
                    <p:inputTextarea id="dsDescripcion" rows="5"
                        cols="30"
                        readonly="#{facesContext.renderResponse}"
                        value="#{convocatoriasBean.convocatoriaDTO.dsDescripcion}" />
                </div>
            </div>
        </p:outputPanel>

        <div class="space" />

        <p:outputPanel id="outpanelSolicitudesSolapa">
            <h:outputText styleClass="tituloFormulario"
                value="#{bundle['convocatorias.detalle.solicitudes.label.solicitudes.titulo']}" />
        </p:outputPanel>

        <div class="space" />

        <!-- VMM 25/09/26 MD-2133: el estilo del selectCheckboxMenu de Estado (.estadoFilterCombo) se
             movio a saii_tramitacion.css para poder reutilizarlo tambien en solapaExpedientes. -->

        <p:outputPanel id="outputPanelListadoFilterSolicitud">
            <div class="ui-g">


                <div class="ui-g-12 ui-md-12 ui-lg-12">

                    <!--  DNI  -->
                    <div class="ui-g-12 ui-md-1 ui-lg-1">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.dni']}" />
                    </div>
                    <div class="ui-g-12 ui-md-3 ui-lg-3">
                        <p:outputPanel id="cdNumIden">
                            <p:inputText maxlength="9"
                                value="#{solicitudBean.interesadoFilter.cdNumIden}" />
                            <p:outputPanel
                                styleClass="icono fa fa-fw fa-question-circle"
                                id="helpInteresadoFilterCdNumIden"
                                value="#{icon['icono.ayuda']}"
                                alt="#{bundle['convocatorias.detalle.solicitudes.label.dni.tooltipForm']}"
                                title="#{bundle['convocatorias.detalle.solicitudes.label.dni.tooltipForm']}" />
                            <p:tooltip
                                for="helpInteresadoFilterCdNumIden"
                                value="#{bundle['convocatorias.detalle.solicitudes.label.dni.tooltipForm']}" />
                        </p:outputPanel>
                    </div>


                    <!--  Nombre/Razón Social  -->
                    <div class="ui-g-12 ui-md-2 ui-lg-2 text-right">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.nombreInteresado']}" />
                    </div>

                    <div class="ui-g-12 ui-md-3 ui-lg-3">
                        <p:outputPanel id="dsNombre">
                            <p:inputText maxlength="150"
                                value="#{solicitudBean.interesadoFilter.dsNombre}" />
                            <p:outputPanel
                                styleClass="icono fa fa-fw fa-question-circle"
                                id="helpInteresadoFilterDsNombre"
                                value="#{icon['icono.ayuda']}"
                                alt="#{bundle['convocatorias.detalle.solicitudes.label.nombre.tooltipForm']}"
                                title="#{bundle['convocatorias.detalle.solicitudes.label.nombre.tooltipForm']}" />
                            <p:tooltip
                                for="helpInteresadoFilterDsNombre"
                                value="#{bundle['convocatorias.detalle.solicitudes.label.nombre.tooltipForm']}" />
                        </p:outputPanel>
                    </div>
                </div>
            </div>


            <div class="ui-g-12 ui-md-12 ui-lg-12">

                <!--  Primer Apellido  -->
                <div class="ui-g-12 ui-md-1 ui-lg-1">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.apellido1Interesado']}" />
                </div>
                <div class="ui-g-12 ui-md-3 ui-lg-3">
                    <p:outputPanel id="dsApellido1">
                        <p:inputText maxlength="150"
                            value="#{solicitudBean.interesadoFilter.dsApellido1}" />
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpInteresadoFilterDsApellido1"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.apellido1.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.apellido1.tooltipForm']}" />
                        <p:tooltip for="helpInteresadoFilterDsApellido1"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.apellido1.tooltipForm']}" />
                    </p:outputPanel>
                </div>


                <!--  Segundo Apellido  -->
                <div class="ui-g-12 ui-md-2 ui-lg-2 text-right">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.apellido2Interesado']}" />
                </div>
                <div class="ui-g-12 ui-md-3 ui-lg-3">
                    <p:outputPanel id="dsApellido2">
                        <p:inputText maxlength="150"
                            value="#{solicitudBean.interesadoFilter.dsApellido2}" />
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpInteresadoFilterDsApellido2"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.apellido2.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.apellido2.tooltipForm']}" />
                        <p:tooltip for="helpInteresadoFilterDsApellido2"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.apellido2.tooltipForm']}" />
                    </p:outputPanel>
                </div>

            </div>

            <div class="ui-g-12 ui-md-12 ui-lg-12">

                <!--  Organismo - solo tiene sentido en modo "solicitudes" (MD-2133). VMM 25/09/26: un
                      <div rendered="..."> no funciona en Facelets (rendered solo se procesa en
                      componentes JSF), asi que se usa h:panelGroup layout="block" en su lugar, que
                      renderiza igual como un <div> pero si soporta rendered. -->
                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-1 ui-lg-1"
                    rendered="#{solicitudBean.tablaSeleccionada eq 'solicitudes'}">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.organismo']}" />
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-3 ui-lg-3"
                    rendered="#{solicitudBean.tablaSeleccionada eq 'solicitudes'}">
                    <p:outputPanel id="organismoFilterPanel">
                        <p:inputText id="organismoFilter" maxlength="200"
                            value="#{solicitudBean.organismoFilter}" />
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpOrganismoFilter"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.organismo.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.organismo.tooltipForm']}" />
                        <p:tooltip for="helpOrganismoFilter"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.organismo.tooltipForm']}" />
                    </p:outputPanel>
                </h:panelGroup>

                <!--  Acronimo Entidad - solo tiene sentido en modo "solicitudes" (MD-2133)  -->
                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-2 ui-lg-2 text-right"
                    rendered="#{solicitudBean.tablaSeleccionada eq 'solicitudes'}">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.acronimoEntidad']}" />
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-3 ui-lg-3"
                    rendered="#{solicitudBean.tablaSeleccionada eq 'solicitudes'}">
                    <p:outputPanel id="acronimoEntidadFilterPanel">
                        <p:inputText id="acronimoEntidadFilter" maxlength="50"
                            value="#{solicitudBean.acronimoEntidadFilter}" />
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpAcronimoEntidadFilter"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.acronimoEntidad.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.acronimoEntidad.tooltipForm']}" />
                        <p:tooltip for="helpAcronimoEntidadFilter"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.acronimoEntidad.tooltipForm']}" />
                    </p:outputPanel>
                </h:panelGroup>

            </div>

            <div class="ui-g-12 ui-md-12 ui-lg-12">

                <!--  Codigo de Expediente  -->
                <div class="ui-g-12 ui-md-1 ui-lg-1">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.codExpediente']}" />
                </div>
                <div class="ui-g-12 ui-md-3 ui-lg-3">
                    <p:outputPanel id="codExpedienteFilterPanel">
                        <p:inputText id="codExpedienteFilter" maxlength="50"
                            value="#{solicitudBean.codExpedienteFilter}" />
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpCodExpedienteFilter"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.codExpediente.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.codExpediente.tooltipForm']}" />
                        <p:tooltip for="helpCodExpedienteFilter"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.codExpediente.tooltipForm']}" />
                    </p:outputPanel>
                </div>

                <!--  Estado (seleccion multiple) - estado de Solicitud en modo "solicitudes", estado de
                      Expediente en modo "expedientes" (MD-2133)  -->
                <div class="ui-g-12 ui-md-2 ui-lg-2 text-right">
                    <h:outputText styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.estado']}" />
                </div>
                <div class="ui-g-12 ui-md-3 ui-lg-3">
                    <p:outputPanel id="estadoFilterPanel">
                        <p:selectCheckboxMenu id="estadoFilter" styleClass="estadoFilterCombo"
                            value="#{solicitudBean.estadoFilter}"
                            label=""
                            updateLabel="true" filter="false" panelStyle="width:300px">
                            <!-- VMM 15/10/26 MD-3125: sin los estados que solo se listan con "Mostrar Iniciadas" marcado -->
                            <f:selectItems value="#{solicitudBean.tablaSeleccionada eq 'expedientes' ? comboBean.getComboEstadoExpediente(solicitudBean.mostrarIniciadas) : comboBean.getComboEstadoSolicitud(solicitudBean.mostrarIniciadas)}" />
                        </p:selectCheckboxMenu>
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpEstadoFilter"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.solicitudes.label.estado.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.solicitudes.label.estado.tooltipForm']}" />
                        <p:tooltip for="helpEstadoFilter"
                            value="#{bundle['convocatorias.detalle.solicitudes.label.estado.tooltipForm']}" />
                    </p:outputPanel>
                </div>

            </div>

            <div class="ui-g-12 ui-md-12 ui-lg-12">

                <!-- check solicitudes iniciadas -->
                <div class="ui-g-12 ui-md-3 ui-lg-3">
                    <h:outputLabel for="mostrarIniciadas"
                        styleClass="label"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.iniciadas']}" />
                    <p:selectBooleanCheckbox  id="mostrarIniciadas"
                        value="#{solicitudBean.mostrarIniciadas}">

                        <f:facet name="events">
                            <!-- VMM 15/10/26 MD-3125: al desmarcar se quitan del filtro de Estado los estados que
                                 dependen del check, y el combo se vuelve a pintar (update @form) sin ellos -->
                            <p:ajax listener="#{solicitudBean.alCambiarMostrarIniciadas}" update="@form" />
                        </f:facet>

                    </p:selectBooleanCheckbox >

                    <p:outputPanel
                        styleClass="icono fa fa-fw fa-question-circle"
                        id="helpMostrariniciadas"
                        value="#{icon['icono.ayuda']}"
                        alt="#{bundle['convocatorias.detalle.solicitudes.label.mostrarIniciadas.tooltipForm']}"
                        title="#{bundle['convocatorias.detalle.solicitudes.label.mostrarIniciadas.tooltipForm']}" />
                    <p:tooltip for="helpMostrariniciadas" escape="false"
                        value="#{bundle['convocatorias.detalle.solicitudes.label.mostrarIniciadas.tooltipForm']}" />
                </div>
            </div>


        </p:outputPanel>

        <div class="space" />

        <!-- Botones de filtro de solicitudes -->
        <div id="botoneraListaSolicitudes">
            <atlasp:button action="#{solicitudBean.filtrar}" ajax="true"
                execute="outputPanelListadoFilterSolicitud"
                render="panelListadoSolicitudesConvocatoria"
                value="#{bundle['boton.filtrar']}"
                alt="#{bundle['boton.filtrar']}"
                title="#{bundle['boton.filtrar']}" icon="fas fa-filter"
                tipoBoton="btn-primary">
            </atlasp:button>
            <atlasp:button action="#{solicitudBean.borrarFiltros}"
                ajax="false" execute="@this"
                render="outputPanelListadoFilterSolicitud panelListadoSolicitudesConvocatoria"
                value="#{bundle['boton.borrarFiltros']}"
                alt="#{bundle['boton.borrarFiltros']}"
                onclick="PF('listaSolicitudes').clearFilters()"
                title="#{bundle['boton.borrarFiltros']}"
                icon="fas fa-ban" tipoBoton="btn-secondary">
            </atlasp:button>
        </div>

        <p:spacer height="5" styleClass="tituloFormulario" />

		<h:panelGroup id="panelListadoSolicitudesConvocatoria" layout="block">
    		<!-- Radio Button para seleccionar entre Solicitudes y Expedientes -->
    		<h:panelGrid columns="3" style="margin-bottom: 20px;">

            <p:selectOneRadio id="tablaSelector" value="#{solicitudBean.tablaSeleccionada}" layout="grid" columns="2">
                <f:selectItem itemLabel="#{bundle['convocatorias.detalle.solicitudes.label.solicitudes']}" 
                             itemValue="solicitudes" />
                <f:selectItem itemLabel="#{bundle['convocatorias.detalle.solicitudes.label.expedientes']}" 
                             itemValue="expedientes" />

                <p:ajax event="change"
                        listener="#{solicitudBean.alCambiarTablaSeleccionada}"
                        update="outputPanelListadoFilterSolicitud panelListaPaginada panelDataTable"
                        onstart="atlas.ui.Loading.showLoad('appLoading')"
                        oncomplete="atlas.ui.Loading.hideLoad('appLoading')" />
            </p:selectOneRadio>

    	</h:panelGrid>
    
    	<!-- Lista Paginada de Solicitudes (visible cuando se selecciona "Solicitudes") -->
    	<p:outputPanel id="panelListaPaginada">
        	<atlasp:listaPaginada id="listaSolicitudes"
            	listAndCountMethod="#{solicitudBean.obtenerListaSolicitudes}"
            	filtro="#{solicitudBean.filtros}" sortMode="single"
            	reflow="true" export="true" pijama="true"
            	exportTitle="Solicitudes" exportFile="Solicitudes"
            	rendered="#{solicitudBean.tablaSeleccionada eq 'solicitudes'}">

            <!-- COD_EXPEDIENT_SOL -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.cdExpediente']}"
                field="cdExpedienteSol" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.cdExpedienteSol}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- DNI -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.dni']}"
                field="interesado.cdNumIden" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText
                        value="#{item.interesadoDTO.cdNumIden}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- VMM 30/09/26 MD-3096: columna de Acronimo Entidad, calculada en lote en
                 SolicitudBean.obtenerAcronimoEntidad (ver ejecutarLogicaObtenerSolicitudes) para no
                 disparar una consulta por fila. No es una propiedad mapeada de Solicitud, asi que no
                 lleva "field" (no se puede ordenar por ella). -->
            <!-- VMM 02/10/26 MD-3096: solo en convocatorias de resolucion conjunta (mostrarColumna);
                 exportable ligado a lo mismo, porque una columna exportable pero no visible se sigue
                 incluyendo en el Excel/PDF. -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.acronimoEntidad']}"
                order="false" filtrable="false"
                mostrarColumna="#{solicitudBean.convocatoriaResolucionConjunta}"
                exportable="#{solicitudBean.convocatoriaResolucionConjunta}">
                <ui:define name="value">
                    <h:outputText
                        value="#{solicitudBean.obtenerAcronimoEntidad(item.interesadoDTO.idInteresado)}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Nombre/Razón Social Interesado -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.nombreInteresado']}"
                field="interesado.dsNombre" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText
                        value="#{item.interesadoDTO.dsNombre}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Primer Apellido Interesado -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.apellido1Interesado']}"
                field="interesado.dsApellido1" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText
                        value="#{item.interesadoDTO.dsApellido1}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Segundo Apellido Interesado -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.apellido2Interesado']}"
                field="interesado.dsApellido2" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText
                        value="#{item.interesadoDTO.dsApellido2}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Tipo de actor -->
<!--             <atlasp:columnaListaPaginada -->
<!--                 label="#{bundle['convocatorias.detalle.solicitudes.label.tipoActor']}" -->
<!--                 field="tipoActor.dsValor" filtrable="false" -->
<!--                 exportable="true" filterMatchMode="exact"> -->
<!--                 <ui:define name="value"> -->
<!--                     <h:outputText -->
<!--                         value="#{item.tipoActorDTO.dsValor}" -->
<!--                         styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" /> -->
<!--                 </ui:define> -->
<!--             </atlasp:columnaListaPaginada> -->

            <!-- Antes: field="tipoActor.dsValor" y value="#{item.tipoActorDTO.dsValor}" -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.tipoActor']}"
                field="idSolicitud" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText
                        value="#{solicitudBean.mapaTipoActorSolicitudes[item.idSolicitud]}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Fecha alta -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.fechaFirma']}"
                field="fcAltaFila" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.fcPresentacion}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy - HH:mm:ss" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Estado de la solicitud -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.estado']}"
                field="estado.dsValor" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <div class="ui-g text-center">
                        <div class="ui-g-12">
                            <h:outputText
                                value="#{item.estadoDTO.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                            </h:outputText>
                        </div>
                        <div class="ui-g-12">                                
                            <p:outputPanel
                                id="idAlertaTramitesPendiente"
