    <!-- Dialogo Anualidades -->
    <p:dialog id="dialogVerHistoricoAnual" widgetVar="dialogVerHistoricoAnual"
        dynamic="true" minHeight="120" closable="false" modal="true">
        <div class="ui-g">
            <f:facet name="header">
                <h:outputText id="dialogVerHistoricoAnualTitulo"
                    value="#{bundle['convocatorias.detalle.anualidad.historico']}" />
            </f:facet>

            <div class="ui-g-12 ui-md-12 ui-lg-12"
                style="text-align: left;">
                <atlasp:listaPaginada
                    id="listaPaginadaExpedienteAnualidadHist"
                    listAndCountMethod="#{expedienteAnualidadBean.obtenerListaExpedienteAnualHist}"
                    sortMode="single" reflow="true" export="true"
                    exportTitle="ExpedienteAnualidadHist"
                    exportFile="ExpedienteAnualidadHist">
                    <!-- Nm anualidad -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.anualidad']}"
                        field="nmAnualidad" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText value="#{item.nmAnualidad}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Tipo de convocatoria Anualidad -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.tipo']}"
                        field="tipoExpedienteAnualidad.dsValor"
                        filtrable="false" exportable="true"
                        filterMatchMode="exact">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.tipoExpedienteAnualidadDTO.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Fecha inicio de ejecución -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.fecha.inicio.ejecucion']}"
                        field="fcIniEjecucion" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText value="#{item.fcIniEjecucion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" >
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" yearRange="c-25:c+45"
                                    locale="es_ES"/>
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Fecha fin de ejecución -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.fecha.fin.ejecucion']}"

                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">

                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" >
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" yearRange="c-25:c+45"
                                    locale="es_ES"/>
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Observación -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.observaciones']}"
                        field="tlObservacion" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText value="#{item.tlObservacion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                     <!-- Usuario de cambio auditoria -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['auditoria.usuario.cambio']}"
                        field="cdUsuAlta"
                        filtrable="false" exportable="true"

                        <ui:define name="value">

                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>   
                    <!-- Fecha de cambio auditoria -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['auditoria.fecha.cambio']}"
                        field="fcAltaFila" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">

                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" yearRange="c-25:c+45"
