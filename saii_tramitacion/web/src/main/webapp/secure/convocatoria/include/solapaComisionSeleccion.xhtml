<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<!-- VMM 27/10/26 MD-3094: pestaña "Comisión de selección" de la resolución de convocatoria -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <p:outputPanel id="panelComisionSeleccion">

        <h:panelGroup id="botoneraComisionSeleccion" layout="block">
            <atlasp:button ajax="false"
                action="#{resolucionConvBean.descargarExcelComisionSeleccion}"
                value="#{bundle['resolucion.comision.seleccion.exportar']}"
                alt="#{bundle['resolucion.comision.seleccion.exportar']}"
                title="#{bundle['resolucion.comision.seleccion.exportar']}"
                icon="fas fa-file-excel" tipoBoton="btn-success">
            </atlasp:button>
        </h:panelGroup>

        <div class="space" />

        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['resolucion.comision.seleccion.titulo']}" />

        <atlasp:listaPaginada id="listaComisionSeleccion"
            listAndCountMethod="#{resolucionConvBean.obtenerComisionSeleccion}"
            sortMode="single" reflow="true" export="false" pijama="true">

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.linea']}"
                field="linea" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.linea}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.nombre']}"
                field="nombreEmpresa" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.nombreEmpresa}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.expediente']}"
                field="numeroExpediente" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.numeroExpediente}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.nif']}"
                field="nif" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.nif}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.puntuacion']}"
                field="puntuacion" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.puntuacion}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.orden']}"
                field="orden" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.orden}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.ayudasolicitada']}"
                field="ayudaSolicitada" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.ayudaSolicitada}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.cuantia']}"
                field="cuantiaPropuesta" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.cuantiaPropuesta}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.credito']}"
                field="creditoAcumulado" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.creditoAcumulado}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.estado']}"
                field="dsEstado" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.dsEstado}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.resultado']}"
                field="resultadoComision" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.resultadoComision}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['resolucion.comision.seleccion.motivo']}"
                field="motivo" filtrable="false" exportable="false">
                <ui:define name="value">
                    <h:outputText value="#{item.motivo}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
        </atlasp:listaPaginada>
    </p:outputPanel>

</ui:composition>
