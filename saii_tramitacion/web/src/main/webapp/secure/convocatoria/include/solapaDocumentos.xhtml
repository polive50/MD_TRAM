                        <h:outputText

            <atlasp:columnaListaPaginada

            <atlasp:columnaListaPaginada

                    <f:facet name="input">

            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.tipo.documento.titulo']}"
                filtrable="false" exportable="true" editable="true">
                <ui:define name="value">

                    <f:facet name="output">
                        <!-- Documento -->
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor}"
                            rendered="#{(item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null) and
                                    (!item.esDocumentoRequisito)}" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']} - #{item.tlObservaciones}"
                            rendered="#{(item.tipoDocumentoDTO == null or item.tipoDocumentoDTO.idValor == null) and 
                                        (!item.esDocumentoRequisito) }" />

                        <!-- Documento de requisito-->
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor} (#{item.dsDocumentoRequisito})"
                            rendered="#{(item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null) and 
                                        (item.esDocumentoRequisito) }" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']} (#{item.dsDocumentoRequisito})"
                            rendered="#{(item.tipoDocumentoDTO == null or item.tipoDocumentoDTO.idValor == null) and 
                                        (item.esDocumentoRequisito) }" />
                    </f:facet>
                    <f:facet name="input">
                        <!-- VMM 24/09/26 MD-2359: se anade nmConstante == 120 (ENVIO_COLA_NOTIFICACIONES)
                             para que el tipo de documento deje de ser editable una vez enviado a la cola
                             de notificaciones/Portafirmas, igual que ya pasaba con Revision OK (116).
                             VMM 25/09/26 MD-2359: se anade tambien el estado del EXPEDIENTE (no del
                             documento) Pendiente revision subsanacion (estadoRevAdmin.nmConstante == 238),
                             para cubrir el caso en que el expediente ya esta en ese estado aunque el
                             documento concreto no lo refleje todavia.
                             VMM 29/09/26 MD-2359: se anade tambien estadoDTO.nmConstante == 211
                             (Constantes.EstadoExpediente.PENDIENTE_SUBSANACION_REQUISITOS) - es un campo
                             y un estado distintos de estadoRevAdminDTO (238), y el combo seguia habilitado
                             cuando el expediente estaba en Pendiente Subsanación/Requisitos porque ese
                             estado no se comprobaba en ningun sitio. -->
                        <h:selectOneMenu style="width: 180px!important"
                            valueChangeListener="#{documentoBean.changeListener}"
                            rendered="#{item.tipoDocumentoDTO.idValor eq null}"
                            disabled="#{convocatoriasBean.modoConsulta or item.estadoDTO.nmConstante == 116
                                        or item.estadoDTO.nmConstante == 120
                                        or expedienteBean.expedienteDTO.estadoRevAdminDTO.nmConstante == 238
                                        or expedienteBean.expedienteDTO.estadoDTO.nmConstante == 211}">
                            <f:selectItems
                                value="#{comboBean.getComboTipoDocumentoConvocatoria(solicitudBean.idConvocatoria)}"   
                                var="tipo" itemLabel="#{tipo.dsValor}"
                                itemValue="#{tipo.idValor}" />
                            <f:ajax
                                listener="#{documentoBean.cambiarTipoDocumento(item.idExpedienteDoc)}"
                                render="listaPaginadaExpedienteDocumentos" />
                        </h:selectOneMenu>
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor}"
                            rendered="#{item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null}" />
                    </f:facet>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            
<!--             "#{documentoBean.obtenerListaAltaTipoDocumento}"  -->

            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.estado']}"
                field="estado.idValor" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.estadoDTO.dsValor}"
                        styleClass="#{item.estilo}" />
                    <!-- VMM 30/09/26: ajax="true" process="@this" - accion de solo lectura, no hace falta procesar el formulario completo. -->
                    <atlasp:button ajax="true" process="@this"
                        update="panelMotivo"
                        alt="#{bundle['listado.columna.consultar']}"
                        title="#{bundle['listado.columna.consultar']}"
                        rendered="#{(infoUsuarioBean.rolSuperAdministrador or
                                    infoUsuarioBean.rolAdministrador or
                                    infoUsuarioBean.rolSupervisor or
                                    infoUsuarioBean.rolGestor)
                                    and (item.estadoDTO.nmConstante == 117 or item.estadoDTO.nmConstante == 111)
                                    and expedienteBean.expedienteDTO.estadoDTO.nmConstante == 239}"

                        icon="fas fa-search" tipoBoton="btn-link">
                    </atlasp:button>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada

                </ui:define>
            </atlasp:columnaListaPaginada>

                    </ui:define>
                </atlasp:columnaListaPaginada>

                <ui:define name="value">
                    <h:outputText value="#{item.cdFica}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

             <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.codigoEreg']}"
                    field="codigoEreg" filtrable="false" exportable="true"
                    filterMatchMode="exact">
                    <ui:define name="value">                       
                        <h:outputText value="#{documentoBean.codigoEregFormateado(item.codigoEreg)}"

                    </ui:define>
                </atlasp:columnaListaPaginada>

             <atlasp:columnaListaPaginada

                    <ui:define name="value">                      
                        <h:outputText value="#{item.fechaRegistroString}" 
                                      rendered="#{empty item.cdAnexoEreg}" />        
                        <h:outputText value="#{expedienteBean.expedienteDTO.fcFirma}"

                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                        </h:outputText>                                 
                    </ui:define>
                </atlasp:columnaListaPaginada>

                <ui:define name="value">

                        <div class="ui-g-12 text-center">
                            <ui:fragment
                                rendered="#{item.cdAnexoEreg == ''}">
                                                                
                                <atlasp:button
                                    action="#{documentoBean.subirExpedienteDocDialog(item)}"                                                                   
                                    ajax="true"
                                    alt="#{bundle['boton.subir']}"
                                    title="#{bundle['boton.subir']}"
                                    icon="fas fa-upload"
                                    tipoBoton="btn-link"
                                    rendered="#{documentoBean.habilitarBotonSubirDocumento(item, convocatoriasBean.modoConsulta)}"
                                    render="outPanelSubirExpedienteDocumento"
                                    onclick="atlas.ui.Loading.showLoad('appLoading')" />

<!--                                     onclick="form.target='_blank'"  -->

                                    <p:link href="#{request.contextPath}/DescargaFicaServlet" 
                                            target="_blank" 
                                            title="#{bundle['boton.descargar']}"
                                            rendered="#{item.cdFica != null}">
                                        <f:param name="cdFica" value="#{item.cdFica}" />
                                        <i class="fas fa-download"></i>
                                    </p:link>
                                    
                                    

                                <!-- Subsanar -->
<!--                                 <atlasp:button -->
<!--                                     action="#{documentoBean.mostrarSubsanarDocumento(item)}" -->
<!--                                     ajax="true" -->
<!--                                     alt="#{bundle['boton.subsanar']}" -->
<!--                                     title="#{bundle['boton.subsanar']}" -->
<!--                                     icon="fas fa-exclamation-triangle" -->
<!--                                     tipoBoton="btn-link" -->
<!--                                     render="panelSubsanar" -->

                                <atlasp:button action="#{documentoBean.mostrarSubsanarDocumento(item)}"
                                   ajax="true"
                                   execute="@this"
                                   render="panelSubsanar"
                                   alt="#{bundle['boton.subsanar']}"
                                   title="#{bundle['boton.subsanar']}"
                                   icon="fas fa-exclamation-triangle"
                                   tipoBoton="btn-link"
                                   onclick="atlas.ui.Loading.showLoad('appLoading')"
                                   rendered="#{!expedienteBean.expedienteDTO.modoConsulta and item.puedeSubsanar}"/>

                                <!-- Aprobar -->
                                <atlasp:button
                                    action="#{documentoBean.aprobarDocumento(item)}"
                                    ajax="true"
                                    alt="#{bundle['boton.aprobar']}"
                                    title="#{bundle['boton.aprobar']}"
                                    icon="fas fa-check"
                                    tipoBoton="btn-link"
                                    render="outpanelDocumentosSolapa"
                                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                                    rendered="#{!expedienteBean.expedienteDTO.modoConsulta and
                                                documentoBean.habilitarBotonAprobarDocumento(convocatoriasBean.modoConsulta, convocatoriasBean.convocatoriaDTO.idEstado.idValor, item)}">
                                    <f:facet name="events">
                                        <p:confirm
                                            header="#{bundle['popup.confirmar.operacion.titulo']}"

                                            icon="ui-icon-alert" />
                                    </f:facet>
                                </atlasp:button>

                                <!-- Desaprobar -->
                                <atlasp:button
                                    action="#{documentoBean.desaprobarDocumento(item)}"
                                    ajax="true"
                                    alt="#{bundle['boton.desaprobar']}"
                                    title="#{bundle['boton.desaprobar']}"
                                    icon="fas fa-ban"
                                    tipoBoton="btn-link"
                                    render="outpanelDocumentosSolapa"
                                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                                    rendered="#{documentoBean.habilitarBotonDesaprobarDocumento(convocatoriasBean.modoConsulta, convocatoriasBean.convocatoriaDTO.idEstado.idValor, item)}">
                                    <f:facet name="events">

                                            icon="ui-icon-alert" />
                                    </f:facet>
                                </atlasp:button>

                                <atlasp:button
                                    action="#{documentoBean.revertirEvaluacionDocumento(item)}"
                                    ajax="true"
                                    alt="#{bundle['boton.revertir']}"
                                    title="#{bundle['boton.revertir']}"
                                    icon="fas fa-history"
                                    tipoBoton="btn-link"
                                    render="outpanelDocumentosSolapa"
                                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')"

                                    <f:facet name="events">

                                            message="#{bundle['popup.confirmar.pregunta.revertir']}"
                                            icon="ui-icon-alert" />
                                    </f:facet>
                                </atlasp:button>

                                <!-- Mostrar denegación -->
                                <!-- VMM 30/09/26: ajax="true" process="@this" - accion de solo lectura, no hace falta procesar el formulario completo. -->

                                    action="#{documentoBean.mostrarDenegacionDocumento(item)}"
                                    ajax="true"
                                    process="@this"
                                    alt="#{bundle['boton.ver.observacion']}"
                                    title="#{bundle['boton.ver.observacion']}"
                                    icon="fas fa-eye"
                                    tipoBoton="btn-link"
                                    render="panelSubsanar"
                                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                                    rendered="#{documentoBean.habilitarBotonMostrarDenegacion(item)}" />

                                <!-- VMM 30/09/26: ajax="true" process="@this" - accion de solo lectura, no hace falta procesar el formulario completo. -->

                                    action="#{documentoBean.mostrarHistoricoDocumento(item)}"
                                    ajax="true"
                                    process="@this"
                                    alt="#{bundle['boton.historico']}"

                                   rendered="#{item.puedeDescargarICDA}" />
