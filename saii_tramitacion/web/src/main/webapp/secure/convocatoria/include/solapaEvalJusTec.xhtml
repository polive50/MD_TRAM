            widgetVar="dialogDesAprobarEvaluacionJCT"
            header="#{bundle['expedientes.evaluacion.evaluador.asignado.jct.titulo.desaprobar']}"
            closable="true" dynamic="true" modal="true" width="70%"
            onShow="atlas.ui.Loading.hideLoad('appLoading')">
        <p:outputPanel id="panelDesAprobarEvaluacionJCT">
            <atlasp:facesMessages id="fmDesAprobarEvaluacionJCT"
                modo="notificar" />
            <div class="ui-g">
                <div class="ui-g-12 borde-contenedor">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-4 ui-lg-2 mtb-auto">
                            <h:outputText
                                value="#{bundle['documentos.historico.expediente']}"
                                styleClass="text-bold" />
                        </div>
                        <div class="ui-g-12 ui-md-8 ui-lg-10 mtb-auto">
                            <h:outputText
                                value="#{expedienteBean.expedienteDTO.cdExpediente}" />
                        </div>
                        <div class="ui-g-12">
                            <p:dataTable id="listaEvaluacionDesaprobar" var="item" styleClass="atlas-lp"
                                value="#{evaluacionJusTecBean.evaluadorSeleccionado}" emptyMessage="No se encontraron registros">
                                <p:column
                                    headerText="#{bundle['personas.label..evaluador.identificador.jct']}"
                                    sortBy="#{item.interesadoDTO.cdNumIden}">
                                    <h:outputText value="#{item.interesadoDTO.cdNumIden}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label..evaluador.identificador.jct']}"
                                    sortBy="#{item.interesadoDTO.cdNumIden}">
                                    <h:outputText value="#{item.interesadoDTO.cdNumIden}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.nombres.jct']}"
                                    sortBy="#{item.interesadoDTO.dsNombre}">
                                    <h:outputText value="#{item.interesadoDTO.dsNombre}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.apellido1.jct']}"
                                    sortBy="#{item.interesadoDTO.dsApellido1}">
                                    <h:outputText value="#{item.interesadoDTO.dsApellido1}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.apellido2.jct']}"
                                    sortBy="#{item.interesadoDTO.dsApellido2}">
                                    <h:outputText value="#{item.interesadoDTO.dsApellido2}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.estado.jct']}"
                                    sortBy="#{item.estadoDTO.dsValor}">
                                    <h:outputText value="#{item.estadoDTO.dsValor}" />
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.fecha.inicio.jct']}"
                                    sortBy="#{item.fcIniPlazo}">
                                    <h:outputText value="#{item.fcIniPlazo}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                 </p:column>
                                  <p:column
                                    headerText="#{bundle['personas.label.evaluador.fecha.fin.jct']}"
                                    sortBy="#{item.fcFinPlazo}">
                                    <h:outputText value="#{item.fcFinPlazo}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                 </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.comentario.jct.evaluador']}"
                                        sortBy="#{item.item.obsEval}">
                                    <h:outputText value="#{item.obsEval}" />
                                </p:column>
                                <p:column
                                    headerText="#{bundle['personas.label.evaluador.comentario.jct.gestor']}"
                                        sortBy="#{item.item.obsGest}">
                                    <h:outputText value="#{item.obsGest}" />
                                </p:column>
                                 <p:column
                                    headerText="#{bundle['personas.label.evaluador.comentario.jct.motivo.rechazo']}"
                                        sortBy="#{item.item.dsComentario}">
                                    <p:inputTextarea value="#{item.dsComentario}"
                                        maxlength="2000" rows="2"/>
                                </p:column>
                                <p:column
                                    headerText="#{bundle['personas.label.evaluador.nota.jct']}"
                                    sortBy="#{item.nmNotaFinal}">
                                    <h:outputText value="#{item.nmNotaFinal}" />
                                 </p:column>
                            </p:dataTable>
                        </div>
                        <div class="ui-g-12">
                             <atlasp:button
                                action="#{evaluacionJusTecBean.desAprobarEvaluacionJCT}"
                                ajax="true"
                                value="#{bundle['boton.guardar']}"
                                alt="#{bundle['boton.guardar']}"
                                title="#{bundle['boton.guardar']}"
                                icon="fas fa-save"
                                tipoBoton="btn-success"
                                onclick="atlas.ui.Loading.showLoad('appLoading')"
                                oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                                disabled="#{evaluacionJusTecBean.isExpedienteRechazadoDefinitivo()}" />
                            <!-- VMM 30/09/26: ajax="true" process="@this" - accion de solo lectura, no hace falta procesar el formulario completo. -->
                            <atlasp:button
                                action="#{evaluacionJusTecBean.cerrarDesAprobarEvaluacionJCT}"
                                ajax="true"
                                process="@this"
                                update="panelDesAprobarEvaluacionJCT"
                                value="#{bundle['boton.cerrar']}"
                                alt="#{bundle['boton.cerrar']}"
                                title="#{bundle['boton.cerrar']}"
                                icon="fas fa-times"
                                tipoBoton="btn-secondary"
                                onclick="atlas.ui.Loading.showLoad('appLoading')"
                                oncomplete="atlas.ui.Loading.hideLoad('appLoading')" />
                        </div>
                    </div>
                </div>
            </div>
        </p:outputPanel>
    </p:dialog>
    
    </p:outputPanel>
    
</ui:composition>
