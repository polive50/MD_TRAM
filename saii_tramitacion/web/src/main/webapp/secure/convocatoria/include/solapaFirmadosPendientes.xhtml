<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.cdNumExpdienteFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.dsDestinatarioFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.dsFirmanteFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.dsTramiteFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.dsVerificadorFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.fcEnvioColaDesdeFir}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesNoteBean.fcEnvioColaHastaFir}" />

    <atlasp:guardarEstado value="#{envioNotificacionesNoteBean.filtros}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesBean.lstEnviosPendientesNote}" />

    <atlasp:guardarEstado
        value="#{envioNotificacionesBean.lstSeleccionadosNote}" />

    <!-- Parametro para seleccionar si se pueden editar los datos -->
    <ui:param name="readOnly" value="true" />

    <p:panelGrid id="outpanelDatosSolapaFirmPendientes" columns="1"
        columnClasses="ui-g-12" layout="grid"
        styleClass="ui-panelgrid-blank">

        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['listados.filtros']}" />
        <p:spacer height="5" />

        <p:outputPanel
            id="outputPanelFormFilterConvocatoriaFirmaPendientes">
            <div class="ui-g">

                <div class="ui-g-12 ui-md-12 ui-lg-12">
                    <div class="ui-g-12 ui-md-1 ui-lg-1">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.pendientes.label.convocatoria']}" />
                    </div>
                    <div class="ui-g-12 ui-md-7 ui-lg-7">
                        <p:inputText maxlength="100" readonly="true"
                            value="#{convocatoriasBean.convocatoriaDTO.cdTitulo}" />
                    </div>
                </div>

                <div class="ui-g-12 ui-md-12 ui-lg-12">
                    <div class="ui-g-12 ui-md-1 ui-lg-1">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.pendientes.label.expediente']}" />
                    </div>
                    <div class="ui-g-12 ui-md-7 ui-lg-7">
                        <p:inputText maxlength="50"
                            value="#{envioNotificacionesNoteBean.cdNumExpdienteFir}">
                        </p:inputText>
                    </div>
                </div>

                <div class="ui-g-12 ui-md-12 ui-lg-12">
                    <div class="ui-g-12 ui-md-1 ui-lg-1">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.label.destinatario']}" />
                    </div>
                    <div class="ui-g-12 ui-md-7 ui-lg-7">
                        <p:inputText maxlength="100"
                            value="#{envioNotificacionesNoteBean.dsDestinatarioFir}" />
                    </div>
                </div>

                <div class="ui-g-12 ui-md-12 ui-lg-12">
                    <div class="ui-g-4 ui-md-1 ui-lg-1">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.pendientes.label.fecha']}" />
                    </div>
                    <div class="ui-g-4 ui-md-1 ui-lg-1">
                        <h:outputLabel for="anio" styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.pendientes.label.desde']}" />
                    </div>
                    <div class="ui-g-4 ui-md-3 ui-lg-3">
                        <atlasp:calendario
                            id="calendarioPlazoDesdeFirmaPendientes"
                            value="#{envioNotificacionesNoteBean.fcEnvioColaDesdeFir}"
                            datePattern="dd/MM/yyyy">
                        </atlasp:calendario>
                        <p:outputPanel
                            id="helpFcPlazoDesdePresFirmaPendientes"
                            styleClass="icono fa fa-fw fa-question-circle"
                            alt="#{bundle['convocatorias.detalle.label.plazoDesde.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.plazoDesde.tooltipForm']}" />
                        <p:tooltip for="helpFcPlazoDesdePres"
                            value="#{bundle['convocatorias.detalle.label.plazoDesde.tooltipForm']}" />
                    </div>

                    <div class="ui-g-4 ui-md-1 ui-lg-1">
                        <h:outputLabel for="anio" styleClass="label"
                            value="#{bundle['convocatorias.envio.notificaciones.pendientes.label.hasta']}" />
                    </div>
                    <div class="ui-g-4 ui-md-3 ui-lg-3">
                        <atlasp:calendario
                            id="calendarioPlazoHastaFirmaPendientes"
                            value="#{envioNotificacionesNoteBean.fcEnvioColaHastaFir}"
                            datePattern="dd/MM/yyyy" />
                        <p:outputPanel
                            id="helpFcPlazoHastaPresFirmaPendientes"
                            styleClass="icono fa fa-fw fa-question-circle"
                            alt="#{bundle['convocatorias.detalle.label.plazoHasta.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.plazoHasta.tooltipForm']}" />
                        <p:tooltip for="helpFcPlazoHastaPres"
                            value="#{bundle['convocatorias.detalle.label.plazoHasta.tooltipForm']}" />
                    </div>
                </div>

<!--                 <div class="ui-g-12 ui-md-12 ui-lg-12" > -->
<!--                     <div class="ui-g-12 ui-md-1 ui-lg-1"> -->
<!--                         <h:outputText styleClass="label" -->
<!--                             value="#{bundle['convocatorias.envio.notificaciones.label.Firmante']}" /> -->
<!--                     </div> -->
<!--                     <div class="ui-g-12 ui-md-7 ui-lg-7"> -->
<!--                         <p:inputText maxlength="100" -->
<!--                             value="#{envioNotificacionesNoteBean.dsFirmanteFir}" /> -->
<!--                     </div> -->
<!--                 </div> -->

            </div>

        </p:outputPanel>

        <div class="space" />

        <div id="botoneraEnvioNotificacionFirmaPendientes">
            <atlasp:button
                action="#{envioNotificacionesNoteBean.filtrar}"
                ajax="true" execute="outpanelDatosSolapaFirmPendientes"
                render="panelListadoEnvioNotificacionesFirmaPendientes"
                value="#{bundle['boton.filtrar']}"
                alt="#{bundle['boton.filtrar']}"
                title="#{bundle['boton.filtrar']}" icon="fas fa-filter"
                tipoBoton="btn-primary"
                onclick="atlas.ui.Loading.showLoad('appLoading')"
                oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
            </atlasp:button>
        </div>

        <h:panelGroup
            id="panelListadoEnvioNotificacionesFirmaPendientes"
            layout="block">
            <atlasp:listaPaginada
                id="listaEnvioNotificacionesFirmaPendientes"
                listAndCountMethod="#{envioNotificacionesBean.obtenerListaEnviosNote}"
                filtro="#{envioNotificacionesNoteBean.filtros}"
                sortMode="single" selectable="#{!infoUsuarioBean.rolAuditor}"
                selectionMode="multiCheck" reflow="true" export="true"
                pijama="true"
                selection="#{envioNotificacionesBean.lstSeleccionadosNote}"
                exportTitle="Solicitudes" exportFile="Solicitudes"
                render="btnEnviarNoteNotificaciones">

                <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.envio.notificaciones.pendientes.label.convocatoria']}"
                    filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText
                            value="#{convocatoriasBean.convocatoriaDTO.cdTitulo}" />
                    </ui:define>

                </atlasp:columnaListaPaginada>


                <!-- COD_EXPEDIENT_SOL  -->
                <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.envio.notificaciones.pendientes.label.expediente']}"
                    field="cdExpediente" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.cdExpediente}" />
                    </ui:define>
                </atlasp:columnaListaPaginada>

                <!-- Nombre/Razón Social Interesado  -->
                <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.envio.notificaciones.label.destinatario']}"
                    field="dsDestinatario" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.dsDestinatario}" />
                    </ui:define>
                </atlasp:columnaListaPaginada>

              
                  <!-- Primer Apellido Interesado  -->
                <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.envio.notificaciones.label.tramite']}"
                    field="dsTramite" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.dsTramite}" />
                    </ui:define>
                </atlasp:columnaListaPaginada>
                
                  <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.detalle.solicitudes.label.fechaPTFR']}"
                    field="fcEnvioCola" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.fcEnvioPTFR}">
                            <f:convertDateTime type="date"
                                pattern="dd/MM/yyyy - HH:mm:ss" />
                        </h:outputText>
                    </ui:define>
                </atlasp:columnaListaPaginada>
                
                
                  <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.detalle.solicitudes.label.fechaFirmaPTFR']}"
                    field="fcEnvioCola" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.fcFirmaPTFR}">
                            <f:convertDateTime type="date"
                                pattern="dd/MM/yyyy - HH:mm:ss" />
                        </h:outputText>
                    </ui:define>
                </atlasp:columnaListaPaginada>

                <atlasp:columnaListaPaginada
                    label="#{bundle['convocatorias.detalle.solicitudes.label.estadoPTFR']}"
                    field="cdEstadoNote" filtrable="false"
                    exportable="true" filterMatchMode="exact">
                    <ui:define name="value">
                        <h:outputText value="#{item.cdEstadoPTFR}" />
                    </ui:define>
                </atlasp:columnaListaPaginada>
                
                <atlasp:columnaListaPaginada
                    label="#{bundle['listado.columna.acciones']}"
                    order="false">
                    <ui:define name="value">
                        <div class="ui-g">
                            <div class="ui-g-12 text-center">
                                <ui:fragment
                                    rendered="#{not empty item.idDocumentoPTFR and envioNotificacionesBean.habilitarDescargarDocumento()}">
                                    <!-- Descargar (CD_ARCHIVO_PTFR)-->
                                    <atlasp:button
                                        action="#{envioNotificacionesBean.descargarDocumentoPtfrRespuesta(item.idDocumentoPTFR)}"
                                        execute="listaEnvioNotificaciones"
                                        render="listaEnvioNotificaciones"
                                        ajax="false"
                                        alt="#{bundle['boton.descargar']}"
                                        title="#{bundle['boton.descargar']}"
                                        icon="fas fa-download"
                                        tipoBoton="btn-link" />
                                </ui:fragment>
                           </div>
                        </div>
                    </ui:define>
                </atlasp:columnaListaPaginada>
                
<!--                   <atlasp:columnaListaPaginada -->
<!--                     label="#{bundle['convocatorias.detalle.solicitudes.label.fechaColaNote']}" -->
<!--                     field="fcEnvioNote" filtrable="false" -->
<!--                     exportable="true" filterMatchMode="exact"> -->

<!--                         <h:outputText value="#{item.fcEnvioNote}"> -->
<!--                             <f:convertDateTime type="date" -->
<!--                                 pattern="dd/MM/yyyy - HH:mm:ss" /> -->
<!--                         </h:outputText> -->
<!--                     </ui:define> -->
<!--                 </atlasp:columnaListaPaginada> -->
                
<!--                   <atlasp:columnaListaPaginada -->
<!--                     label="#{bundle['convocatorias.detalle.solicitudes.label.fechaLectura']}" -->
<!--                     field="fcLecturaNote" filtrable="false" -->
<!--                     exportable="true" filterMatchMode="exact"> -->
<!--                     <ui:define name="value"> -->
<!--                         <h:outputText value="#{item.fcLecturaNote}"> -->
<!--                             <f:convertDateTime type="date" -->
<!--                                 pattern="dd/MM/yyyy - HH:mm:ss" /> -->
<!--                         </h:outputText> -->
<!--                     </ui:define> -->
<!--                 </atlasp:columnaListaPaginada> -->


<!--                 Primer Apellido Interesado  -->
<!--                 <atlasp:columnaListaPaginada -->
<!--                     label="#{bundle['convocatorias.detalle.solicitudes.label.estadoNote']}" -->
<!--                     field="cdEstadoNote" filtrable="false" -->
<!--                     exportable="true" filterMatchMode="exact"> -->
<!--                     <ui:define name="value"> -->
<!--                         <h:outputText value="#{item.cdEstadoNote}" /> -->
<!--                     </ui:define> -->
<!--                 </atlasp:columnaListaPaginada> -->


            </atlasp:listaPaginada>

            <div class="space" />

        </h:panelGroup>

        <p:commandButton id="btnEnviarNoteNotificaciones"
            class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-icon-left atlas-btn btn-warning"
            action="#{envioNotificacionesBean.enviarANote}" ajax="true"
            value="#{bundle['boton.enviar.note']}"
            alt="#{bundle['boton.enviar.note']}"
            title="#{bundle['boton.enviar.note']}"
            icon="fas fa-paper-plane"
            update="outpanelDatosSolapaFirmPendientes"
            onclick="atlas.ui.Loading.showLoad('appLoading') "
            disabled="#{envioNotificacionesBean.comprobarListadoNote()}"
            oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
            <f:facet name="events">
                <p:confirm
                    header="#{bundle['popup.confirmar.operacion.titulo']}"
                    message="#{bundle['popup.confirmar.pregunta.note.envio']}"
                    icon="ui-icon-alert" />
            </f:facet>
        </p:commandButton>



        <div class="space" />

    </p:panelGrid>
</ui:composition>
