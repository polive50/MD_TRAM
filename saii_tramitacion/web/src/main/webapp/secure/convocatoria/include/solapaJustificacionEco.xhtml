       <p:panelGrid id="outpanelJustificacionEcoSolapa" columns="1"
        columnClasses="ui-g-12" layout="grid"
        styleClass="ui-panelgrid-blank">
      
      
    <p:fieldset
        legend="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.justeco.documentacion']}">
        <!-- Contenido del fieldset -->
        
        <!-- TABLA JUS ECO POR PERIODOS -->
        <atlasp:listaPaginada id="listaPeriodosJustEco"
            listAndCountMethod="#{justificacionEcoBean.obtenerListaPeriodoExp}"
            sortMode="single" reflow="true" export="true"
            exportTitle="PeriodosJustEco" exportFile="PeriodosJustEco"
            pijama="true"
            viewSelectRows="false">
            
            <atlasp:columnaListaPaginada label="#{bundle['tooltip.revisar']}" width="5%" styleClass="text-center">
                <ui:define name="value">
                    <p:commandLink ajax="true"
                        title="#{bundle['tooltip.seleccionar']}"
                        styleClass="btn-link-radio"
                        actionListener="#{justificacionEcoBean.seleccionarPeriodo(item)}"
                        onclick="atlas.ui.Loading.showLoad('appLoading')"
                        oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                        <i class="far #{(justificacionEcoBean.expedienteJusEcoSeleccionado!=null and 
                                    justificacionEcoBean.expedienteJusEcoSeleccionado.idExpedienteJusEco==item.idExpedienteJusEco)?'fa-check-circle':'fa-circle'}" />
                    </p:commandLink>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada field="nmPeriodo"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.periodos.titulo']}">
                <ui:define name="value">
                    <h:outputText value="#{item.nmPeriodo}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada field="tipoPeriodo"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.periodos.tipo']}">
                <ui:define name="value">
                    <h:outputText value="#{item.tipoExpedienteJusEcoDTO.dsValor}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada field="fcIniJustiEconomica"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.inicio.contrato']}">
                <ui:define name="value">
                    <h:outputText value="#{item.fcIniJustiEconomica}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada field="fcFinJustiEconomica"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.fin.contrato']}">
                <ui:define name="value">
                    <h:outputText value="#{item.fcFinJustiEconomica}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
             <atlasp:columnaListaPaginada field="idEstado"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.periodos.estado']}">
                <ui:define name="value">
                    <h:outputText value="#{item.idEstadoDTO.dsValor}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
             <atlasp:columnaListaPaginada field="tlObservacionDelCiudadano"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.periodos.observaciones.del.ciudadano']}">
                <ui:define name="value">
                    <h:outputText value="#{item.tlObservacionDelCiudadano}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada field="tlObservacionParaCiudadano"
                filtrable="false" exportable="true"
                label="#{bundle['convocatorias.detalle.periodos.observaciones.para.ciudadano']}">
                <ui:define name="value">
                    <h:outputText value="#{item.tlObservacionParaCiudadano}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
        </atlasp:listaPaginada>
        
        <p:spacer height="5" />

        <h:panelGrid columns="2" cellpadding="5">
            <h:outputText
                value="#{bundle['convocatorias.detalle.expediente.documentacion.label.justif.periodo']}"
                styleClass="titulo-formulario" 
                rendered="#{justificacionEcoBean.expedienteJusEcoSeleccionado != null}"/>
        </h:panelGrid>

        <!-- TABLA JUS ECO DOC POR PERIODOS (CON PARTIDAS) -->
        <atlasp:listaPaginada id="listaDocumentosJustEco"
            listAndCountMethod="#{justificacionEcoBean.obtenerListaDocumentosExpedienteEco}"
            reflow="true" pijama="true" sortMode="single" export="true"
            exportTitle="DocumentosJustEco" exportFile="DocumentosJustEco"
            viewSelectRows="false"
            rendered="#{justificacionEcoBean.expedienteJusEcoSeleccionado != null}">
            
             <atlasp:columnaListaPaginada label="#{bundle['tooltip.revisar']}" width="5%" styleClass="text-center">
                <ui:define name="value">
                    <p:commandLink ajax="true"
                        title="#{bundle['tooltip.seleccionar']}"
                        styleClass="btn-link-radio"
                        actionListener="#{justificacionEcoBean.seleccionarPartida(item)}"
                        onclick="atlas.ui.Loading.showLoad('appLoading')"
                        oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                        <i class="far #{(justificacionEcoBean.expedienteJusEcoDocSeleccionado!=null and 
                                    justificacionEcoBean.expedienteJusEcoDocSeleccionado.idExpedienteJusEcoDoc==item.idExpedienteJusEcoDoc)?'fa-check-circle':'fa-circle'}" />
                    </p:commandLink>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.partidaPresup']}"
                filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.consultarPartidaPresupMonto(item.expedientePresupMontoDTO.idExpedientePresup)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.presupFinan']}"
                field="nmImporte" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.calcularSumImportePartida(item.expedientePresupMontoDTO.idExpedientePresup)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.ayudaConcedida']}"
                field="ayudaConcedida" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.calcularAyudaConcedidaConSumatorio(item.expedientePresupMontoDTO.idExpedientePresup)}" 
                                 rendered="#{justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S'}" />
                    <h:outputText value="#{justificacionEcoBean.calcularAyudaConcedidaSinSumatorio(item.expedientePresupMontoDTO.nmImporte)}" 
                                 rendered="#{justificacionEcoBean.convocatoriaDTO.itConceptoPresup == null or justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'N'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.importeJustif']}"
                field="nmImporteJustificado" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.calcularSumImporteJustifPartida(item.expedientePresupMontoDTO.idExpedientePresup)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.importeAdmitido']}"
                field="nmImporteAdmitido" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <!-- Caso 1: Solo muestra el sumatorio en caso de tener conceptos la partida -->
                    <h:outputText value="#{justificacionEcoBean.calcularSumImporteAdmitPartida(item.expedientePresupMontoDTO.idExpedientePresup)}" 
                                 rendered="#{justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S'}"/>
                    <!-- Caso 2: Permite edición en caso de no tener conceptos la partida -->
                    <p:inputNumber
                        symbol=" €" minValue="0" maxValue="9999999999.99"
                        symbolPosition="s" decimalSeparator="," thousandSeparator="."
                        value="#{item.expedientePresupMontoDTO.nmImporteAdmitido}"
                        readonly="#{justificacionEcoBean.deshabilitarImporteAdmitidoPartida(item.expedientePresupMontoDTO.idExpedientePresup)}"
                        rendered="#{justificacionEcoBean.convocatoriaDTO.itConceptoPresup == null or justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'N'}">
                        <p:ajax event="change"
                            process="@this"
                            onstart="atlas.ui.Loading.showLoad('appLoading')"
                            oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                            listener="#{justificacionEcoBean.actualizarImporteAdmitido(item.expedientePresupMontoDTO.idExpedientePresupMonto, item.expedientePresupMontoDTO.nmImporteAdmitido)}" />
                    </p:inputNumber>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.estado']}"
                field="estadoPartida" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.obtenerEstadoPartida(item.expedientePresupMontoDTO.idExpedientePresup)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
        </atlasp:listaPaginada>
        
        <p:spacer height="5" />
        
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputText
                value="#{bundle['convocatorias.detalle.expediente.documentacion.label.justif.partida']}"
                styleClass="titulo-formulario" 
                rendered="#{justificacionEcoBean.expedienteJusEcoDocSeleccionado != null and justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S'}"/>
        </h:panelGrid>

        <!-- TABLA JUS ECO DOC POR CONCEPTOS -->
        <atlasp:listaPaginada id="listaDocumentosJustEcoDetalle"
            editable="true" editMode="cell"
            listAndCountMethod="#{justificacionEcoBean.obtenerListaDocumentosExpEcoDetalle}"
            reflow="true" pijama="true" sortMode="single" export="true"
            exportTitle="DocumentosJustEcoDetalle" exportFile="DocumentosJustEcoDetalle"
            viewSelectRows="false"
            rendered="#{justificacionEcoBean.expedienteJusEcoDocSeleccionado != null and justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S'}">
            
             <atlasp:columnaListaPaginada label="#{bundle['tooltip.revisar']}" width="5%" styleClass="text-center">
                <ui:define name="value">
                    <p:commandLink ajax="true"
                        title="#{bundle['tooltip.seleccionar']}"
                        styleClass="btn-link-radio"
                        actionListener="#{justificacionEcoBean.seleccionarConcepto(item)}"
                        onclick="atlas.ui.Loading.showLoad('appLoading')"
                        oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                        <i class="far #{(justificacionEcoBean.expedienteJusEcoDocDetSeleccionado!=null and 
                                    justificacionEcoBean.expedienteJusEcoDocDetSeleccionado.idExpedienteJusEcoDoc==item.idExpedienteJusEcoDoc)?'fa-check-circle':'fa-circle'}" />
                    </p:commandLink>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.concepto']}"
                field="concepto" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.concepto}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.presupFinan']}"
                field="importe" filtrable="false" exportable="true" filterMatchMode="exact">
                <p:inputNumber
                    readonly="true"
                    symbol=" €" minValue="0"
                    maxValue="9999999999.99" symbolPosition="s"
                    decimalSeparator="," thousandSeparator="."
                    value="#{item.importe}">
                </p:inputNumber>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.ayudaConcedida']}"
                field="ayudaConcedida" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.calcularAyudaConcedidaSinSumatorio(item.importe)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.importeJustif']}"
                field="importeJustificado" filtrable="false" exportable="true" filterMatchMode="exact">
                <p:inputNumber
                    readonly="true"
                    symbol=" €" minValue="0"
                    maxValue="9999999999.99" symbolPosition="s"
                    decimalSeparator="," thousandSeparator="."
                    value="#{item.importeJustificado}">
                </p:inputNumber>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.importeAdmitido']}"
                field="importeAdmitido" filtrable="false" exportable="true" filterMatchMode="exact">    
                <ui:define name="value">
                    <p:inputNumber
                        symbol=" €" minValue="0" maxValue="9999999999.99"
                        symbolPosition="s" decimalSeparator="," thousandSeparator="."
                        value="#{item.importeAdmitido}"
                        readonly="#{justificacionEcoBean.deshabilitarImporteAdmitidoConcepto(item.idEstado)}">
                        <p:ajax event="change"
                            process="@this"
                            onstart="atlas.ui.Loading.showLoad('appLoading')"
                            oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                            listener="#{justificacionEcoBean.actualizarImporteAdmitido(item.idExpedientePresupMonto, item.importeAdmitido)}" />
                    </p:inputNumber>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada 
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.justieco.label.estado']}"
                field="estadoConcepto" filtrable="false" exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{justificacionEcoBean.obtenerEstadoConcepto(item.idEstado)}" />
                </ui:define>
            </atlasp:columnaListaPaginada>
            
        </atlasp:listaPaginada>
        
        <p:spacer height="5" />
        
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputText
                value="#{bundle['convocatorias.detalle.expediente.documentacion.label.justeco.partida']}"
                styleClass="titulo-formulario" 
                rendered="#{(justificacionEcoBean.expedienteJusEcoDocSeleccionado != null and (justificacionEcoBean.convocatoriaDTO.itConceptoPresup == null or justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'N')) or
                        (justificacionEcoBean.expedienteJusEcoDocDetSeleccionado != null and justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S')}"/>
        </h:panelGrid>
        
        <!-- TABLA DE DOCUMENTOS POR PARTIDA/CONCEPTO -->
        <atlasp:listaPaginada id="listaDocumentacionJEPartida"
            listAndCountMethod="#{justificacionEcoBean.obtenerListaDocumentacionJEPartida}"
            reflow="true" pijama="true" sortMode="single" export="true"
            exportTitle="DocumentacionJEPartida" exportFile="DocumentacionJEPartida"
            viewSelectRows="false"
            rendered="#{(justificacionEcoBean.expedienteJusEcoDocSeleccionado != null and (justificacionEcoBean.convocatoriaDTO.itConceptoPresup == null or justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'N')) or
                        (justificacionEcoBean.expedienteJusEcoDocDetSeleccionado != null and justificacionEcoBean.convocatoriaDTO.itConceptoPresup == 'S')}">
            
            <!-- Tipo Documento -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.tipo.documento.titulo']}"
                filtrable="false" exportable="true" editable="true">
                <ui:define name="value">

                    <f:facet name="output">
                        <!-- Documento -->
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor}"
                            rendered="#{(item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null) and
                                    (!item.esDocumentoRequisito)}" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']}"
                            rendered="#{(item.tipoDocumentoDTO == null or item.tipoDocumentoDTO.idValor == null) and 
                                        (!item.esDocumentoRequisito) }" />

                        <!-- Documento de requisito-->
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor} (#{item.dsDocumentoRequisito})"
                            rendered="#{(item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null) and 
                                        (item.esDocumentoRequisito) }" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']} (#{item.dsDocumentoRequisito})"
                            rendered="#{(item.tipoDocumentoDTO == null or item.tipoDocumentoDTO.idValor == null) and 
                                        (item.esDocumentoRequisito) }" />
                    </f:facet>
                    <f:facet name="input">
                        <h:selectOneMenu style="width: 180px!important"
                            valueChangeListener="#{documentoBean.changeListener}"
                            rendered="#{item.tipoDocumentoDTO.idValor eq null}">
                            <f:selectItems
                                value="#{documentoBean.obtenerListaAltaTipoDocumento}"
                                var="tipo" itemLabel="#{tipo.dsValor}"
                                itemValue="#{tipo.idValor}" />
                            <f:ajax
                                listener="#{justificacionEcoBean.cambiarTipoDocumento(item.idExpedienteDoc)}"
                                render="listaPaginadaExpedienteDocumentos" />
                        </h:selectOneMenu>
                        <h:outputText
                            value="#{item.tipoDocumentoDTO.dsValor}"
                            rendered="#{item.tipoDocumentoDTO != null and item.tipoDocumentoDTO.idValor != null}" />
                    </f:facet>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <!-- Fecha -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.fecha']}"
                field="fcModifFila" filtrable="false" exportable="true">
                <ui:define name="value">
                    <h:outputText
                        rendered="#{item.fcAltaFila != null and item.fcModifFila == null}"
                        value="#{item.fcAltaFila}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy - HH:mm:ss" />
                    </h:outputText>
                    <h:outputText
                        rendered="#{item.fcAltaFila != null and item.fcModifFila != null}"
                        value="#{item.fcModifFila}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy - HH:mm:ss" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>
            
            <!-- Estado -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.estado']}"
                field="estado.idValor" filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.estadoDTO.dsValor}"
                        styleClass="#{item.estilo}" />
                    <!-- VMM 30/09/26: ajax="true" process="@this" - accion de solo lectura, no hace falta procesar el formulario completo. -->
                    <atlasp:button ajax="true" process="@this"
                        update="panelMotivoJE"
                        alt="#{bundle['listado.columna.consultar']}"
                        title="#{bundle['listado.columna.consultar']}"
                        rendered="#{(infoUsuarioBean.rolSuperAdministrador or
                                    infoUsuarioBean.rolAdministrador or
                                    infoUsuarioBean.rolSupervisor or
                                    infoUsuarioBean.rolGestor)
                                    and (item.estadoDTO.nmConstante == 117 or item.estadoDTO.nmConstante == 111)
                                    and expedienteBean.expedienteDTO.estadoDTO.nmConstante == 239}"
                        action="#{justificacionEcoBean.mostrarMotivo(item)}"
                        icon="fas fa-search" tipoBoton="btn-link">
                    </atlasp:button>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <!-- Obligatorio -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.obligatorio']}"
                filtrable="false" exportable="true">
                <ui:define name="value">
                    <h:outputText
                        value="#{item.bloqueComponenteDTO.itObligatorio ? 'SI' : 'NO'}" />
