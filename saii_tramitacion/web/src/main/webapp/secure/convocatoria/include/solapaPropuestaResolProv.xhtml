            <h:panelGroup id="botoneraPropuestaResolucionProvisional" layout="block">

                <!-- [BOTÓN 1: SUBIR] Variante ACTIVA -->
                <atlasp:button id="btnSubirResolucionProv"
                    ajax="true"
                    action="#{resolucionConvBean.subirPropuestaResolucionProvisionalDialog}"
                    value="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    alt="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    title="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    icon="fa fa-upload" tipoBoton="btn-primary"
                    rendered="#{resolucionConvBean.habilitarBotonSubirResolucionProvisional(convocatoriasBean.modoConsulta)}">
                </atlasp:button>
            
                <!-- [BOTÓN 1: SUBIR] Variante DESHABILITADA (En gris) -->
                <atlasp:button id="btnSubirResolucionProvDisabled"
                    type="button"
                    value="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    alt="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    title="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
                    icon="fa fa-upload" tipoBoton="btn-primary"
                    disabled="true"
                    rendered="#{!resolucionConvBean.habilitarBotonSubirResolucionProvisional(convocatoriasBean.modoConsulta)}">
                </atlasp:button>
            
                <!-- [BOTÓN 2: DESCARGAR] Variante ACTIVA -->
                <atlasp:button id="btnDescargarResolucionProv"
                    ajax="false" 
                    action="#{resolucionConvBean.descargarFicheroProvisional}"
                    value="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    alt="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    title="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    icon="fa fa-download" tipoBoton="btn-primary"
                    rendered="#{resolucionConvBean.habilitarDescargarPropuestaProv()}">
                </atlasp:button>
            
                <!-- [BOTÓN 2: DESCARGAR] Variante DESHABILITADA (En gris) -->
                <atlasp:button id="btnDescargarResolucionProvDisabled"
                    type="button"
                    value="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    alt="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    title="#{bundle['solapa.resol.boton.bajar.resol.provisional']}"
                    icon="fa fa-download" tipoBoton="btn-primary"
                    disabled="true"
                    rendered="#{!resolucionConvBean.habilitarDescargarPropuestaProv()}">
                </atlasp:button>
            
                <!-- [BOTÓN 3: ENVIAR A PORTAFIRMAS] Variante ACTIVA -->
                <atlasp:button id="botonEnviarResolucionProvPortafirmas"
                    ajax="true" process="@form"
                    update="botoneraPropuestaResolucionProvisional :convocatoriaForm:convocatoriaFormMessages"
                    action="#{resolucionConvBean.enviarPropuestaProvPortafirmas}"
                    value="#{bundle['boton.enviar.portafirma']}"
                    alt="#{bundle['boton.enviar.portafirma']}"
                    title="#{bundle['boton.enviar.portafirma']}"
                    icon="fas fa-paper-plane" tipoBoton="btn-warning"
                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')"
                    rendered="#{resolucionConvBean.habilitarEnviarColaPortafirmasProvisional(convocatoriasBean.modoConsulta) and !resolucionConvBean.bloquearBotonPorEnvioExistentePtfr()}">
                </atlasp:button>
            
                <!-- [BOTÓN 3: ENVIAR A PORTAFIRMAS] Variante DESHABILITADA (En gris) -->
                <atlasp:button id="botonEnviarResolucionProvPortafirmasDisabled"
                    type="button"
                    value="#{bundle['boton.enviar.portafirma']}"
                    alt="#{bundle['boton.enviar.portafirma']}"
                    title="#{bundle['boton.enviar.portafirma']}"
                    icon="fas fa-paper-plane" tipoBoton="btn-warning"
                    disabled="true"
                    rendered="#{!resolucionConvBean.habilitarEnviarColaPortafirmasProvisional(convocatoriasBean.modoConsulta) or resolucionConvBean.bloquearBotonPorEnvioExistentePtfr()}">

        <p:dialog id="dialogSubirPropuestaResolucionProvisional"
            widgetVar="dialogSubirPropuestaResolucionProvisional"
            header="#{bundle['solapa.resol.boton.subir.resol.provisional']}"
            closable="false" dynamic="true" modal="true" width="25%"
            onShow="atlas.ui.Loading.hideLoad('appLoading')">
        
            <atlasp:facesMessages id="fmSubirResolucionProvisional" modo="notificar" />
        
            <p:outputPanel id="outPanelSubirResolucionProvisional">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="ui-g-12">
                    <h:outputText styleClass="tituloFormulario"
                        value="#{bundle['solapa.resol.boton.subir.resol.provisional']}" />
                </p:panelGrid>
        
                <atlasp:message tipo="info"
                    texto="#{bundle['solapa.resol.error.debe.seleccionar.fichero']}"
                    rendered="#{resolucionConvBean.mostrarMensajeElegirFichero}" />
        
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="ui-g-12">
                    <h:outputText value="#{bundle['convocatorias.tab.documentos.label.archivo']}" />
                    
                    <!-- Cambiado a archivoResolucion para coincidir con tu bean en Java -->
                    <p:fileUpload value="#{resolucionConvBean.archivoResolucion}"
                        mode="simple" skinSimple="true"
                        label="#{bundle['convocatorias.tab.documentos.label.archivo.elegir']}"
                        accept=".pdf" allowTypes="/(\.|\/)(pdf)$/"
                        invalidFileMessage="Solo se permiten archivos PDF" />
                </p:panelGrid>
        
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="ui-g-12">
                    <p:column>
                        <!-- Llama a cargarFicheroResolucionProvisional -->
                        <atlasp:button
                            actionListener="#{resolucionConvBean.cargarFicheroResolucionProvisional}"
                            ajax="true" process="@form" 
                            value="#{bundle['popup.guardar']}"
                            alt="#{bundle['popup.guardar']}" title="#{bundle['popup.guardar']}"
                            icon="fas fa-save" tipoBoton="btn-success"
                            update="botoneraPropuestaResolucionProvisional :convocatoriaForm:convocatoriaFormMessages fmSubirResolucionProvisional"
                            onclick="atlas.ui.Loading.showLoad('appLoading')"
                            oncomplete="atlas.ui.Loading.hideLoad('appLoading')" />
        
                        <!-- Cierra el diálogo correspondiente -->
                        <atlasp:button value="#{bundle['popup.cerrar']}"
                            alt="#{bundle['popup.cerrar']}" title="#{bundle['popup.cerrar']}"
                            icon="fas fa-times" tipoBoton="btn-secondary"
                            action="#{resolucionConvBean.cerrarSubirResolucionProvisionalDialog}"
                            onclick="atlas.ui.Loading.showLoad('appLoading')"
                            oncomplete="atlas.ui.Loading.hideLoad('appLoading')" />
                    </p:column>
                </p:panelGrid>
            </p:outputPanel>
        </p:dialog>
    
    </p:outputPanel>
    
</ui:composition>
