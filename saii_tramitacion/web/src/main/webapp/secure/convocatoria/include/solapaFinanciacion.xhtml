                    </div>

                                                               inputStyle="font-weight: bold; text-align: left; background: #E3EBF6 !important; width: 100%; border: 1px solid #ced4da; color: black !important;"/> </div>
                                        </ui:repeat>

    <h:outputScript>
        // <![CDATA[
        function sincronizarAlturas(claseIzq, claseDer) {
            var tablasIzq = $(claseIzq);
            var tablasDer = $(claseDer);

            if (tablasIzq.length && tablasDer.length) {
                // 1. Sincronizamos los encabezados (thead)
                var headersIzq = tablasIzq.find('thead tr');
                var headersDer = tablasDer.find('thead tr');
                
                headersIzq.each(function(index) {
                    var hI = $(this);
                    var hD = headersDer.eq(index);
                    if (hI.length && hD.length) {
                        hI.css('height', 'auto');
                        hD.css('height', 'auto');
                        var maxH = Math.max(hI.outerHeight(), hD.outerHeight());
                        hI.css('height', maxH + 'px');
                        hD.css('height', maxH + 'px');
                    }
                });

                // 2. Sincronizamos las filas de datos y totales (tbody)
                var filasIzq = tablasIzq.find('tbody tr');
                var filasDer = tablasDer.find('tbody tr');
                
                filasIzq.each(function(index) {
                    var fI = $(this);
                    var fD = filasDer.eq(index);
                    if (fI.length && fD.length) {
                        fI.css('height', 'auto');
                        fD.css('height', 'auto');
                        var maxH = Math.max(fI.outerHeight(), fD.outerHeight());
                        fI.css('height', maxH + 'px');
                        fD.css('height', maxH + 'px');
                    }
                });
            }
        }

        function sincronizarTodasLasTablas() {
            // Sincroniza las del presupuesto financiable (si existieran en la vista)
            sincronizarAlturas('.tabla-presupuesto', '.tabla-ayuda');
            
            // Sincroniza las del presupuesto presentado y solicitado
            sincronizarAlturas('.tabla-presentado', '.tabla-solicitada');
        }

        $(document).ready(function() {
            // Retraso de seguridad para que Primefaces dibuje todo (p.ej. anchos de inputNumber)
            setTimeout(sincronizarTodasLasTablas, 150);
        });

        $(document).on('pfAjaxComplete', function() {
            sincronizarTodasLasTablas();
        });
        // ]]>
    </h:outputScript>
