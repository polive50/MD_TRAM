<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">
    
    
    <!-- Recibe un parámetro llamado "bloque" -->
    <ui:param name="bloque" value="#{bloque}" />

    <!-- Renderizado condicional según el tipo de bloque -->
    
    <!-- Lógica para esTipoTexto -->
<!--     <p:column rendered="#{!bloque.esTipoMultiregistro}"> -->
        <p:column rendered="#{bloque.esTipoTexto}">
            <p:repeat
                value="#{bloque.lstBloqueComponenteDTO}"
                var="bloqueComponenteTexto">
                <p:panelGrid columns="1"
                    columnClasses="ui-g-12" layout="grid"
                    styleClass="ui-panelgrid-blank">
                    <p:inputTextarea
                        value="#{bloqueComponenteTexto.datos[0].dsValor}"
                        rows="3" autoResize="false"
                        readonly="true"
                        style="width: 99%;resize: none;"></p:inputTextarea>
                </p:panelGrid>
            </p:repeat>
        </p:column>
    
        <!-- Lógica para esTipoTextoFijo -->
        <p:column rendered="#{bloque.esTipoTextoFijo}">
            <p:repeat
                value="#{bloque.lstBloqueComponenteDTO}"
                var="bloqueComponenteTextoFijo">
                <p:panelGrid columns="1"
                    columnClasses="ui-g-12" layout="grid"
                    styleClass="ui-panelgrid-blank">
                    <p:inputTextarea
                        value="#{bloqueComponenteTextoFijo.componenteDTO.clTextoFijo}"
                        rows="3" autoResize="false"
                        readonly="true"
                        style="width: 99%;resize: none;"></p:inputTextarea>
                </p:panelGrid>
            </p:repeat>
        </p:column>
        
        <!-- Lógica para esTipoListado -->
        <p:column rendered="#{bloque.esTipoListado or bloque.esCuentaBancaria}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                layout="grid"
                styleClass="ui-panelgrid-blank"
                style="overflow: auto!important;">
                <table class="tabla-info">
                    <tr>
                        <p:repeat
                            value="#{bloque.lstBloqueComponenteDTO}"
                            var="bloqueComponenteListado">
                            <th scope="col"><h:outputText
                                    value="#{bloqueComponenteListado.componenteDTO.dsNombre}" />
                            </th>
                        </p:repeat>
                    </tr>
                    <p:repeat
                        value="#{expedienteBean.createArray(bloque.nmFilas)}"
                        var="bloqueComponenteTipoListadoFila"
                        varStatus="status">
                        <tr>
                            <p:repeat
                                value="#{bloque.lstBloqueComponenteDTO}"
                                var="bloqueComponenteTipoLista">
                                <td><p:panelGrid
                                        columns="1"
                                        columnClasses="ui-g-12"
                                        layout="grid"
                                        styleClass="ui-panelgrid-blank">
                                        <ui:fragment
                                            rendered="#{bloqueComponenteTipoLista.componenteDTO.tipoDTO.dsValor=='Campo'}">
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTipoLista.componenteDTO.subTipoDTO.dsValor=='Texto'}">
                                                <p:inputText
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                    readonly="true" />
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTipoLista.componenteDTO.subTipoDTO.dsValor=='Número'}">
                                                                                        
<!--                                                 <p:inputNumber -->
<!--                                                      minValue="0" -->
<!--                                                     maxValue="9999999999.99" -->
<!--                                                     symbolPosition="s" decimalSeparator="," -->
<!--                                                     thousandSeparator="." -->
<!--                                                     value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}" -->
<!--                                                     readonly="true"  -->
<!--                                                     rendered="#{bloque.esTipoListado}"/> -->

                                                  <p:inputText
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                    readonly="true" />                                              
                                            </ui:fragment>
                                             <ui:fragment
                                                rendered="#{bloqueComponenteTipoLista.componenteDTO.subTipoDTO.dsValor=='Moneda'}">
                                                  
                                                  <p:inputText
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                    readonly="true" />
                                                 
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTipoLista.componenteDTO.subTipoDTO.dsValor=='Fecha'}">
                                                <p:calendar
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                    readonly="true"
                                                    showOn="none" />
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTipoLista.componenteDTO.subTipoDTO.dsValor=='MultiTexto'}">
                                                <p:inputTextarea
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                    rows="2"
                                                    readonly="true"></p:inputTextarea>
                                            </ui:fragment>
                                        </ui:fragment>
                                        <ui:fragment
                                            rendered="#{bloqueComponenteTipoLista.componenteDTO.tipoDTO.dsValor=='Check'}">
                                            <!-- dsValorMultiple es una lista de true/false por POSICION, alineada con
                                                 lstCheckItems (no una lista de los textos seleccionados) -->
                                            <ui:repeat
                                                value="#{bloqueComponenteTipoLista.componenteDTO.lstCheckItems}"
                                                var="itemCheck" varStatus="statusCheck">
                                                <p:selectBooleanCheckbox
                                                    value="#{bloqueComponenteTipoLista.datos[status.index].dsValorMultiple[statusCheck.index] == 'true'}"
                                                    disabled="true"
                                                    styleClass="check-readonly" />
                                                <h:outputText value="#{itemCheck}" />
                                                <br />
                                            </ui:repeat>
                                        </ui:fragment>
                                        <ui:fragment
                                            rendered="#{bloqueComponenteTipoLista.componenteDTO.tipoDTO.dsValor=='Radio'}">
                                            <p:selectOneRadio
                                                value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                layout="grid"
                                                columns="1"
                                                class="radio-readonly"
                                                disabled="#{readOnly}">
                                                <f:selectItems
                                                    value="#{bloqueComponenteTipoLista.componenteDTO.lstRadioItems}"
                                                    var="itemRadio"
                                                    itemLabel="#{itemRadio}"
                                                    itemValue="#{itemRadio}" />
                                            </p:selectOneRadio>
                                        </ui:fragment>
                                        <ui:fragment
                                            rendered="#{bloqueComponenteTipoLista.componenteDTO.tipoDTO.dsValor=='Combo'}">
                                            <p:selectOneMenu
                                                value="#{bloqueComponenteTipoLista.datos[status.index].dsValor}"
                                                disabled="#{readOnly}"
                                                class="combo-readonly">
                                                <f:selectItem
                                                    itemLabel=""
                                                    itemValue="" />
                                                <f:selectItems
                                                    var="itemCombo"
                                                    itemLabel="#{itemCombo}"
                                                    itemValue="#{itemCombo}"
                                                    value="#{bloqueComponenteTipoLista.componenteDTO.lstComboItems}" />
                                            </p:selectOneMenu>
                                        </ui:fragment>
                                    </p:panelGrid></td>
                            </p:repeat>
                        </tr>
                    </p:repeat>
                </table>
            </p:panelGrid>
        </p:column>
        
        <!-- Lógica para esTipoFormulario -->
        <p:column rendered="#{bloque.esTipoFormulario and !bloque.esTipoMultiregistro}">
            <p:repeat
                value="#{bloque.lstBloqueComponenteDTO}"
                var="bloqueComponenteFormulario">
                <!-- Campos no relacionables -->
                <ui:fragment
                    rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Campo' and 
                                                !bloqueComponenteFormulario.itRelacion}">
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Texto'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:inputText
                                value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                readonly="true" />
                        </p:panelGrid>
                    </ui:fragment>
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Número'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
<!--                                 <p:inputNumber  -->
<!--                                     value="#{bloqueComponenteFormulario.datos[0].dsValor != null ? bloqueComponenteFormulario.datos[0].dsValor.replace(',', '.') : null}" -->
<!--                                     minValue="0" maxValue="9999999999.99" -->
<!--                                     readonly="true" -->
<!--                                     decimalSeparator="," thousandSeparator="." -->
<!--                                 /> -->
                                      <p:inputText
                                        value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                        readonly="true" />

                        </p:panelGrid>
                    </ui:fragment>
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Moneda'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:inputText
                                value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                readonly="true" />
                        </p:panelGrid>
                    </ui:fragment>
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Fecha'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:calendar
                                value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                readonly="true"
                                showOn="none" />
                        </p:panelGrid>
                    </ui:fragment>
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='MultiTexto'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:inputTextarea rows="2"
                                readonly="true"
                                value="#{bloqueComponenteFormulario.datos[0].dsValor}"></p:inputTextarea>
                        </p:panelGrid>
                    </ui:fragment>
                </ui:fragment>
    
                <!-- Campos relacionables -->
                <ui:fragment
                    rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Campo' and 
                                            bloqueComponenteFormulario.itRelacion}">
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Texto'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:inputText
                                value="#{expedienteBean.obtenerDatoRelacionable(bloqueComponenteFormulario.idBloqueComponente)}"
                                readonly="true" />
                        </p:panelGrid>
                    </ui:fragment>
                    <ui:fragment
                        rendered="#{bloqueComponenteFormulario.componenteDTO.subTipoDTO.dsValor=='Número'}">
                        <p:panelGrid columns="2"
                            columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                            layout="grid"
                            styleClass="ui-panelgrid-blank">
                            <h:outputText
                                value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                            <p:inputNumber
                                value="#{expedienteBean.obtenerDatoRelacionable(bloqueComponenteFormulario.idBloqueComponente)}"
                                 minValue="0"
                            maxValue="9999999999.99" readonly="true"
                            symbolPosition="s" decimalSeparator=","
                            thousandSeparator="." />
                        </p:panelGrid>
                    </ui:fragment>
                </ui:fragment>
    
                <ui:fragment rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Check'}">
                    <p:panelGrid columns="2"
                                 columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                                 layout="grid"
                                 styleClass="ui-panelgrid-blank">

                        <h:outputText value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />

                        <!-- dsValorMultiple es una lista de true/false por POSICION, alineada con
                             lstCheckItems (no una lista de los textos seleccionados) -->
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                            <ui:repeat
                                value="#{bloqueComponenteFormulario.componenteDTO.lstCheckItems}"
                                var="itemCheck" varStatus="statusCheck">
                                <p:selectBooleanCheckbox
                                    value="#{bloqueComponenteFormulario.datos[0].dsValorMultiple[statusCheck.index] == 'true'}"
                                    disabled="true"
                                    styleClass="check-readonly" />
                                <h:outputText value="#{itemCheck}" />
                                <br />
                            </ui:repeat>
                        </p:panelGrid>

                    </p:panelGrid>
                </ui:fragment>
                
                <ui:fragment rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Radio'}">
                    <p:panelGrid columns="2"
                                 columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                                 layout="grid"
                                 styleClass="ui-panelgrid-blank">
                        
                        <h:outputText value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                        
                        <p:selectOneRadio value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                          layout="grid" columns="1"
                                          class="radio-readonly"
                                          disabled="true">
                            <f:selectItems value="#{bloqueComponenteFormulario.componenteDTO.lstRadioItems}" 
                                           var="itemRadio"
                                           itemLabel="#{itemRadio}" 
                                           itemValue="#{itemRadio}" />
                        </p:selectOneRadio>
                        
                    </p:panelGrid>
                </ui:fragment>

                <ui:fragment
                    rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Combo'}">
                    <p:panelGrid columns="2"
                        columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                        layout="grid"
                        styleClass="ui-panelgrid-blank">
                        <h:outputText
                            value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                        <p:selectOneMenu
                            value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                            disabled="#{readOnly}"
                            class="combo-readonly">
                            <f:selectItem itemLabel=""
                                itemValue="" />
                            <f:selectItems
                                value="#{bloqueComponenteFormulario.componenteDTO.lstComboItems}" />
                        </p:selectOneMenu>
                    </p:panelGrid>
                </ui:fragment>
                <ui:fragment
                    rendered="#{bloqueComponenteFormulario.componenteDTO.tipoDTO.dsValor=='Catálogo'}">
                    <p:panelGrid columns="2"
                        columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                        layout="grid"
                        styleClass="ui-panelgrid-blank">
                        <h:outputText
                            value="#{bloqueComponenteFormulario.componenteDTO.dsNombre}" />
                        <p:inputText
                                value="#{bloqueComponenteFormulario.datos[0].dsValor}"
                                readonly="true" />
                    </p:panelGrid>
                </ui:fragment>
    
            </p:repeat>
        </p:column>

        <!-- Lógica para esTipoIntensidadAyuda (formato ID_PORCENTAJE_INTENSIDAD) -->
        <p:column rendered="#{bloque.esTipoIntensidadAyuda}">
            <p:repeat
                value="#{bloque.lstBloqueComponenteDTO}"
                var="bloqueComponenteIntensidad">
                <p:panelGrid columns="2"
                    columnClasses="ui-g-12 ui-md-2 mtb-auto, ui-g-12 ui-md-10"
                    layout="grid"
                    styleClass="ui-panelgrid-blank">
                    <h:outputText
                        value="#{bloqueComponenteIntensidad.componenteDTO.dsNombre}" />
                    <p:inputText
                        value="#{bloqueComponenteIntensidad.datos[0].dsValor}"
                        readonly="true" />
                </p:panelGrid>
            </p:repeat>
        </p:column>

        <!-- Lógica para esTipoTabla -->
        <p:column rendered="#{bloque.esTipoTabla}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                style="overflow: auto!important;"
                layout="grid"
                styleClass="ui-panelgrid-blank">
                <table class="tabla-info">
                    <tr>
                        <th scope="col"></th>
                        <p:repeat
                            value="#{bloque.lstBloqueComponenteDTO}"
                            var="bloqueComponenteTablaTit">
                            <ui:fragment
                                rendered="#{bloqueComponenteTablaTit.itColumna and !bloqueComponenteTablaTit.itFila}">
                                <th scope="col"><h:outputText
                                        value="#{bloqueComponenteTablaTit.componenteDTO.dsNombre}" />
                                </th>
                            </ui:fragment>
                        </p:repeat>
                    </tr>
                    <p:repeat
                        value="#{bloque.lstBloqueComponentesFilaDTO}"
                        var="bloqueComponenteTablaTitLat"
                        varStatus="status">
                        <tr>
                            <td><h:outputText
                                    value="#{bloqueComponenteTablaTitLat.componenteDTO.dsNombre}" />
                            </td>
                            <p:repeat
                                value="#{bloque.lstBloqueComponenteDTO}"
                                var="bloqueComponenteTablaInt">
                                <ui:fragment
                                    rendered="#{bloqueComponenteTablaInt.itColumna and !bloqueComponenteTablaInt.itFila}">
                                    <td><p:panelGrid
                                            columns="1"
                                            columnClasses="ui-g-12"
                                            layout="grid"
                                            styleClass="ui-panelgrid-blank">
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTablaInt.componenteDTO.tipoDTO.dsValor=='Campo'}">
                                                <ui:fragment
                                                    rendered="#{bloqueComponenteTablaInt.componenteDTO.subTipoDTO.dsValor=='Texto'}">
                                                    <p:inputText
                                                        value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"
                                                        readonly="true" />
                                                </ui:fragment>
                                                <ui:fragment
                                                    rendered="#{bloqueComponenteTablaInt.componenteDTO.subTipoDTO.dsValor=='Número'}">
                                                    <p:inputNumber
                                                        value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"                                         
                                                         minValue="0"
                                                        maxValue="9999999999.99" readonly="true"
                                                        symbolPosition="s" decimalSeparator=","
                                                        thousandSeparator="." />
                                                </ui:fragment>
                                                <ui:fragment
                                                    rendered="#{bloqueComponenteTablaInt.componenteDTO.subTipoDTO.dsValor=='Fecha'}">
                                                    <p:calendar
                                                        value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"
                                                        readonly="true"
                                                        showOn="none" />
                                                </ui:fragment>
                                                <ui:fragment
                                                    rendered="#{bloqueComponenteTablaInt.componenteDTO.subTipoDTO.dsValor=='MultiTexto'}">
                                                    <p:inputTextarea
                                                        rows="2"
                                                        readonly="true"
                                                        value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}">
                                                    </p:inputTextarea>
                                                </ui:fragment>
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTablaInt.componenteDTO.tipoDTO.dsValor=='Check'}">
                                                <!-- dsValorMultiple es una lista de true/false por POSICION, alineada con
                                                     lstCheckItems (no una lista de los textos seleccionados) -->
                                                <ui:repeat
                                                    value="#{bloqueComponenteTablaInt.componenteDTO.lstCheckItems}"
                                                    var="itemCheck" varStatus="statusCheck">
                                                    <p:selectBooleanCheckbox
                                                        value="#{bloqueComponenteTablaInt.datos[status.index].dsValorMultiple[statusCheck.index] == 'true'}"
                                                        disabled="true"
                                                        styleClass="check-readonly" />
                                                    <h:outputText value="#{itemCheck}" />
                                                    <br />
                                                </ui:repeat>
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTablaInt.componenteDTO.tipoDTO.dsValor=='Radio'}">
                                                <p:selectOneRadio
                                                    value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"
                                                    layout="grid"
                                                    columns="1"
                                                    class="radio-readonly"
                                                    disabled="#{readOnly}">
                                                    <f:selectItems
                                                        value="#{bloqueComponenteTablaInt.componenteDTO.lstRadioItems}"
                                                        var="itemRadio"
                                                        itemLabel="#{itemRadio}"
                                                        itemValue="#{itemRadio}" />
                                                </p:selectOneRadio>
                                            </ui:fragment>
                                            <ui:fragment
                                                rendered="#{bloqueComponenteTablaInt.componenteDTO.tipoDTO.dsValor=='Combo'}">
                                                <p:selectOneMenu
                                                    value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"
                                                    disabled="#{readOnly}"
                                                    class="combo-readonly">
                                                    <f:selectItem
                                                        itemLabel=""
                                                        itemValue="" />
                                                    <f:selectItems
                                                        value="#{bloqueComponenteTablaInt.componenteDTO.lstComboItems}" />
                                                </p:selectOneMenu>
                                            </ui:fragment>
                                        </p:panelGrid></td>
                                </ui:fragment>
                            </p:repeat>
                        </tr>
                    </p:repeat>
                </table>
            </p:panelGrid>
        </p:column>
                        
        <!-- Lógica para esTipoPresupuestoPresentado -->
        <p:column rendered="#{bloque.esTipoPresupuestoPresentado}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                style="overflow: auto!important;"
                layout="grid"
                styleClass="ui-panelgrid-blank">
                               
                <p:dataTable var="presupuesto" styleClass="atlas-lp"
                    value="#{bloque.listaBloqueAuxDTO}"
                    rowIndexVar="rowIndex">
                    <p:columnGroup type="header">
                        <p:row>
                            <p:column rowspan="2" headerText="" />
                            <p:column rowspan="2" headerText="CONCEPTOS"
                                     rendered="#{expedienteBean.esConvocatoriaConceptoPresup}" />
                            <p:repeat var="anualidad"
                                value="#{expedienteBean.listaAnualidades}">
                                <p:column 
                                    headerText="#{anualidad}° Anualidad" />
                            </p:repeat>
                            <p:column rowspan="2" headerText="TOTAL" />
                        </p:row>
                    </p:columnGroup>
    
                    <p:column>
                        <h:outputText
                            value="#{presupuesto.tipoFinanciacionDTO.dsValor}" />
                    </p:column>
    
                    <p:columns
                        value="#{expedienteBean.listaNcolPresupuesto}"
                        var="nCol" columnIndexVar="colIndex"
                        rendered="#{!financiacionBean.esConvocatoriaConceptoPresup}">
                        <p:inputNumber
                            value="#{presupuesto.datos[nCol].dsValor}"
                            symbol=" €" minValue="0"
                            maxValue="9999999999.99" readonly="true"
                            symbolPosition="s" decimalSeparator=","
                            thousandSeparator="." />
                    </p:columns>
                    <p:columns
                        value="#{expedienteBean.listaNcolPresupuesto}"
                        var="nCol" columnIndexVar="colIndex"
                        rendered="#{expedienteBean.esConvocatoriaConceptoPresup}">
                        <h:panelGroup>
                            <h:outputText value="#{presupuesto.datos[nCol].dsValor}" 
                                rendered="#{presupuesto.datos[nCol].nmColumna == 0}" />
                            <p:inputNumber
                                value="#{presupuesto.datos[nCol].dsValor}"
                                symbol=" €" minValue="0"
                                maxValue="9999999999.99" readonly="true"
                                symbolPosition="s" decimalSeparator=","
                                thousandSeparator="." rendered="#{presupuesto.datos[nCol].nmColumna != 0}" />
                        </h:panelGroup>
                    </p:columns>
                </p:dataTable>
            </p:panelGrid>
        </p:column>
    
        <!-- Lógica para esTipoAyudaSolicitada -->                
        <p:column rendered="#{bloque.esTipoAyudaSolicitada}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                style="overflow: auto!important;"
                layout="grid"
                styleClass="ui-panelgrid-blank">
                <table class="tabla-info">
                    <tr>
                        <th scope="col"></th>
                        <p:repeat
                            value="#{bloque.lstBloqueComponenteDTO}"
                            var="bloqueComponenteTablaTit">
                            <ui:fragment
                                rendered="#{bloqueComponenteTablaTit.itColumna and !bloqueComponenteTablaTit.itFila}">
                                <th scope="col"><h:outputText
                                        value="#{bloqueComponenteTablaTit.componenteDTO.dsNombre}" />
                                </th>
                            </ui:fragment>
                        </p:repeat>
                    </tr>
                    <p:repeat
                        value="#{bloque.lstBloqueComponenteDTO}"
                        var="bloqueComponenteTablaTitLat"
                        varStatus="status">
                        <ui:fragment rendered="#{bloqueComponenteTablaTitLat.itFila}">
                            <tr>
                                <td>
                                    <h:outputText
                                        value="#{bloqueComponenteTablaTitLat.tipoFinanciacionDTO.dsValor}" />
                                </td>
                                <p:repeat
                                    value="#{bloque.lstBloqueComponenteDTO}"
                                    var="bloqueComponenteTablaInt">
                                    <ui:fragment
                                        rendered="#{bloqueComponenteTablaInt.itColumna}">
                                        <td><p:panelGrid
                                                columns="1"
                                                columnClasses="ui-g-12"
                                                layout="grid"
                                                styleClass="ui-panelgrid-blank">
                                                <ui:fragment
                                                    rendered="#{bloqueComponenteTablaInt.componenteDTO.tipoDTO.dsValor=='Campo'}">
                                                    <ui:fragment
                                                        rendered="#{bloqueComponenteTablaInt.componenteDTO.subTipoDTO.dsValor=='Número'}">
                                                        <p:inputNumber
                                                            value="#{bloqueComponenteTablaInt.datos[status.index].dsValor}"
                                                            symbol=" €"
                                                            symbolPosition="s"
                                                            thousandSeparator="."
                                                            decimalSeparator=","
                                                            readonly="true" />
                                                    </ui:fragment>
                                                </ui:fragment>
                                            </p:panelGrid></td>
                                    </ui:fragment>
                                </p:repeat>
                            </tr>
                        </ui:fragment>
                    </p:repeat>
                </table>
            </p:panelGrid>
        </p:column>
                     
        <!-- Lógica para esTipoActuaciones -->    
        <p:column rendered="#{bloque.esTipoActuaciones}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                style="overflow: auto!important;"
                layout="grid"
                styleClass="ui-panelgrid-blank">
                <p:dataTable var="actuacion" styleClass="atlas-lp"
                    value="#{bloque.listaBloqueAuxDTO}">
    
                    <p:columnGroup type="header">
                        <p:row>
                            <p:column
                                headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.columna.label.financiacion.codigoActuacion']}" />
                            <p:column
                                headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.columna.label.financiacion.actuacion']}" />
                            <p:column
                                headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.columna.label.financiacion.ofertaProveedor']}" />
                            <p:column
                                headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.columna.label.financiacion.ofertaImporte']}" />
                        </p:row>
                    </p:columnGroup>
                    <p:column>
                        <h:outputText
                            value="#{actuacion.tipoFinanciacionDTO.cdCodigo}" />
                    </p:column>
                    <p:column>
                        <h:outputText
                            value="#{actuacion.tipoFinanciacionDTO.dsValor}" />
                    </p:column>
    
                    <p:columns
                        value="#{expedienteBean.listaNcolActuacion}"
                        var="nCol" columnIndexVar="colIndex">
                        <h:outputText rendered="#{nCol eq 0}"
                            value="#{actuacion.datos[nCol].dsValor}">
                        </h:outputText>
                        <p:inputNumber rendered="#{nCol eq 1}"
                            value="#{actuacion.datos[nCol].dsValor}"
                            symbol=" €" minValue="0"
                            maxValue="9999999999.99" readonly="true"
                            symbolPosition="s" decimalSeparator=","
                            thousandSeparator="." />
                    </p:columns>
                </p:dataTable>
            </p:panelGrid>
            
            <p:panelGrid columns="2" layout="grid"
                styleClass="ui-panelgrid-blank"
                columnClasses="ui-g-12 ui-md-1 mtb-auto, ui-g-12 ui-md-3">
                <h:outputText
                    value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.financiacion.ayudaSolicitada']}" />
    
                <p:inputNumber
                    value="#{expedienteBean.montoAyudaActuacion}"
                    symbol=" €" minValue="0" maxValue="9999999999.99"
                    readonly="true" symbolPosition="s"
                    decimalSeparator="," thousandSeparator="." />
            </p:panelGrid>
        </p:column>
                
        <!-- Lógica para esTipoPlazosEjecAnual -->
        <p:column rendered="#{bloque.esTipoPlazosEjecAnual}">
            <p:panelGrid columns="1" columnClasses="ui-g-12"
                         style="overflow: auto!important;"
                         layout="grid"
                         styleClass="ui-panelgrid-blank">
                         
                   <p:dataTable var="plazoSolic"
                        styleClass="atlas-lp" editable="false" 
                        value="#{expedienteBean.lstBloquePlazos[0].listaBloqueAuxDTO}">                                           
                             <p:columnGroup type="header">
                                <p:row>
                                    <p:column
                                       headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.anualidad']}" />
                                    <p:column 
                                       headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.fecha.inicio.ejecucion']}" />
                                    <p:column
                                       headerText="#{bundle['convocatorias.detalle.solicitudes.expedientes.anualidades.fecha.fin.ejecucion']}" />
                                </p:row>
                            </p:columnGroup>     
                            <p:column>
                                <h:outputText
                                    value="#{plazoSolic.nmOrden}° Anualidad" />
                            </p:column>        
                            <p:columns
                                value="#{expedienteBean.listaNcolPlazo}"
                                var="nCol" columnIndexVar="colIndex">      
                                    <h:outputText value="#{expedienteBean.formatFecha(plazoSolic.datos[nCol].dsValor)}" />
                            </p:columns> 
                    </p:dataTable>          
            </p:panelGrid>
        </p:column>
<!--     </p:column> -->
    
    <!-- Lógica para esTipoMultiregistro -->
    <p:column rendered="#{bloque.esTipoMultiregistro}">
   
        <p:panelGrid columns="1" columnClasses="ui-g-12"
                 style="overflow: auto!important;"
                 layout="grid"
                 styleClass="ui-panelgrid-blank">
                 
                    <!-- VMM 15/10/26 MD-3152: filas de ESTE bloque (antes lstNumFilasMultiregistro, que era la del
                         ultimo bloque multiregistro calculado y se aplicaba a todos) -->
                    <p:dataTable var="indice" value="#{expedienteBean.lstNumFilasMultiregistroPorBloque[bloque.idBloque]}" styleClass="atlas-lp">
                    
                        <p:columns value="#{bloque.lstBloqueComponenteDTO}" var="bloqueComponente"
                                   headerText="#{bloqueComponente.componenteDTO.dsNombre}" columnIndexVar="i">
                    
                            <h:panelGroup>
                                <!-- Tipo Fecha -->
                                <h:outputText value="#{bloqueComponente.datos[indice].dsValor}"
                                            rendered="#{bloqueComponente.componenteDTO.subTipoDTO.dsValor eq 'Fecha'}" />
                    
                                <!-- Tipo Catálogo -->
                                <h:outputText value="#{bloqueComponente.datos[indice].dsValor}"
                                              rendered="#{bloqueComponente.componenteDTO.tipoDTO.dsValor eq 'Catálogo'}" />
                    
                                <!-- Otro tipo -->
                                <h:outputText value="#{bloqueComponente.datos[indice].dsValor}"
                                              rendered="#{bloqueComponente.componenteDTO.tipoDTO.dsValor ne 'Catálogo' 
                                                         and bloqueComponente.componenteDTO.subTipoDTO.dsValor ne 'Fecha'}" />
                            </h:panelGroup>
                        </p:columns>
                    </p:dataTable>
                        
             </p:panelGrid>
    </p:column>
    
    <!-- Lógica para esTipoDocumento -->
    <p:column rendered="#{bloque.esTipoDocumento}">
        <p:repeat
            value="#{bloque.lstBloqueComponenteDTO}"
            var="bloqueComponenteDocInt">
            <p:repeat
                value="#{expedienteBean.expedienteDTO.lstExpedienteDocDTO}"
                var="documento">
                <ui:fragment
                    rendered="#{documento.fcBajaFila == null
                        and documento.bloqueComponenteDTO.idBloqueComponente == bloqueComponenteDocInt.idBloqueComponente}">
                    <p:panelGrid columns="1"
                        columnClasses="ui-g-12"
                        layout="grid"
                        styleClass="ui-panelgrid-blank">
                        <p:column>
                            <h:outputText
                                value="#{documento.tipoDocumentoDTO.dsValor}"
                                styleClass="text-bold"
                                rendered="#{documento.tipoDocumentoDTO != null and documento.tipoDocumentoDTO.idValor != null}" />
                            <h:outputText
                                value="#{bundle['revision.expediente.documento.tipo.documento.vacio']}"
                                styleClass="text-bold"
                                rendered="#{documento.tipoDocumentoDTO == null or documento.tipoDocumentoDTO.idValor == null}" />

<!--                             <atlasp:button -->
<!--                                 action="#{documentoBean.descargarDocumentoFica(documento.cdFica)}" -->
<!--                                 execute="listaPaginadaExpedienteDocumentos" -->
<!--                                 render="listaPaginadaExpedienteDocumentos" -->
<!--                                 ajax="false" -->
<!--                                 alt="#{bundle['boton.descargar']}" -->
<!--                                 title="#{bundle['boton.descargar']}" -->
<!--                                 icon="fas fa-download" -->
<!--                                 tipoBoton="btn-link" /> -->
                             <p:link href="#{request.contextPath}/DescargaFicaServlet"
                                            target="_blank"
                                            title="#{bundle['boton.descargar']}"
                                            rendered="#{documento.cdFica != null}"
                                            >
                                        <f:param name="cdFica" value="#{documento.cdFica}" />
                                        <i class="fas fa-download"></i>
                                    </p:link>
                        </p:column>
                        <p:inputTextarea
                            value="#{documento.tlObservaciones}"
                            rows="3" autoResize="false"
                            readonly="true"
                            style="width: 99%;resize: none;"></p:inputTextarea>
                        <!-- it_autoriza: si el ciudadano autorizo la consulta del documento o no y lo aporto el mismo.
                             Solo se muestra en los bloques de tipo Documento cuya seleccion de documentos es por
                             radio (SAII_BLOQUE.IT_TIPO_SEL_DOC = 'R', ver Constantes.TipoSeleccionDocumento) -->
                        <p:selectOneRadio value="#{documento.itAutoriza}"
                            layout="grid" columns="2"
                            class="radio-readonly"
                            disabled="true"
                            rendered="#{bloque.itTipoSelDoc == 'R'}">
                            <f:selectItem itemValue="S" itemLabel="Autorizo la consulta" />
                            <f:selectItem itemValue="N" itemLabel="No autorizo la consulta y aporto el documento" />
                        </p:selectOneRadio>
                    </p:panelGrid>
                </ui:fragment>
            </p:repeat>
         </p:repeat>
    </p:column>
</ui:composition>
