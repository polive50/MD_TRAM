<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:o="http://omnifaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <ui:param name="cargaMenuHorizontal" value="#{empty cargaMenuHorizontal ? 'true' : cargaMenuHorizontal}" />
    <ui:param name="cargaMenuVertical" value="#{empty cargaMenuVertical ? 'true' : cargaMenuVertical}" />
    <ui:param name="cargarRastroMigas" value="#{empty cargarRastroMigas ? 'true' : cargarRastroMigas}" />
    <ui:param name="plantillaSecure" value="#{empty plantillaSecure ? 'true' : plantillaSecure}" />

    <h:head>
    	<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1"/>
			<meta http-equiv="Pragma" content="no-cache" />
		</f:facet>
    	<ui:decorate template="/WEB-INF/include/commonHead.xhtml">
    		<ui:define name="headerInsert">
    			<ui:insert name="headerInsert" />
    		</ui:define>
    	</ui:decorate>
    </h:head>

    <h:body styleClass="main-body main-container">
        <h:outputStylesheet>
            .page-wrapper{
                max-width:#{cargaMenuVertical ? 'calc(100vw - 240px);' : 'calc(100vw);'}
            }
        </h:outputStylesheet>
        <o:importFunctions type="atlas.componentes.core.utiles.RenderUtils" var="atlasIds" />
        <o:highlight />

        <ui:decorate template="/WEB-INF/include/commonHeader.xhtml">
			<ui:define name="cabeceraCentral">
				<ui:insert name="cabeceraCentral" />
			</ui:define>
		</ui:decorate>

        <ui:decorate template="/WEB-INF/includeApp/commonApp.xhtml" />

        <ui:decorate template="/WEB-INF/include/footer.xhtml">
            <ui:define name="footerCentral">
                <ui:insert name="footerCentral" />
            </ui:define>
        </ui:decorate>

		<div class="main-content" >
            <div class="menu-vertical" style="display:#{not cargaMenuVertical and cargaMenuHorizontal ? 'none' : ''}">
                <ui:insert name="menuVertical" >
                    <h:panelGroup rendered="#{cargaMenuVertical or cargaMenuHorizontal}" styleClass="atlas-layout">
                        <atlasp:menuVertical />
                    </h:panelGroup>
                </ui:insert>
            </div>

            <div class="page-wrapper">
                <div class="barra-rastro atlas-layout tablet-hide">
                    <ui:insert name="barraRastro">
                        <ui:insert name="rastroMigas" >
                            <h:panelGroup rendered="#{cargarRastroMigas}" styleClass="tablet-hide">
                                <atlasp:rastroMigas />
                            </h:panelGroup>
                        </ui:insert>
                        <ui:insert name="panelAyuda" >
                            <ui:decorate template="/WEB-INF/layout/panelAyuda.xhtml"/>
                        </ui:insert>
                    </ui:insert>
                </div>
                <div class="content-wrapper">
                    <ui:insert name="titulo" />
                    <div class="content">
                        <ui:insert name="content" />
                    </div>
                </div>
            </div>
		</div>

    </h:body>

</html>
