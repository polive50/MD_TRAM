<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<f:loadBundle basename="conf/application" var="atlasApp" />

	<div class="title-container">
		<h1>
			<h:outputText value="#{bundle['layout.subtitle']}" escape="false" />
		</h1>

		<form class="userHeader" method="post" id="logoutForm"
			action="#{facesContext.externalContext.request.contextPath}/atlasLogout"
			name="j_spring_security_logout">

			<div class="ui-g user-info">
				<div class="ui-g-2 ui-md-2 ui-lg-1">
					<i class="fa fa-fw fa-user fa-2x"></i>
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-3">
					<h:outputText value="#{bundle['header.title.user']}"
						title="#{bundle['header.title.login']} " />
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-8">
					<h:outputText value="#{systemInfoBean.userName}" id="usuarioLogado"
						title="#{bundle['header.title.user']}"
						rendered="#{atlasApp['app.empresaInfo'] eq 'false'}" />
					<h:outputText styleClass="empresa-info"
						value="#{systemInfoBean.cryptName}"
						rendered="#{atlasApp['app.empresaInfo'] ne 'false'}" />
				</div>
				
				<div class="ui-g-2 ui-md-2 ui-lg-1">
					<i class="fas fa-id-badge fa-2x"></i>
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-3">
					<h:outputText value="#{bundle['header.title.role']} "
						title="#{bundle['header.title.role']} " />
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-8">
					<h:outputText id="userRoles" title="#{bundle['header.title.role']}"
						value="#{systemInfoBean.roles}" />
				</div>
				
				<div class="ui-g-2 ui-md-2 ui-lg-1">
					<i class="fa fa-fw fa-clock fa-2x"></i>
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-3">
					<h:outputText value="#{bundle['header.ultimo.acceso']} "
						title="#{bundle['header.ultimo.acceso']}" />
				</div>
				<div class="ui-g-5 ui-md-5 ui-lg-8">
					<h:outputText value="#{systemInfoBean.ultimoAcceso}"
						title="#{bundle['header.ultimo.acceso']}" />
				</div>
				
				<div class="ui-g-2 ui-md-2 ui-lg-1">
					<p:commandLink rendered="#{atlasApp['app.logout'] != 'false'}"
					target="_self" title="#{bundle['header.cerrar']}"
					alt="#{bundle['header.cerrar']}"
					onclick="logoutForm.submit();return false;"
					styleClass="fa fa-fw fa-power-off fa-5x" />
				</div>
				<div class="ui-g-10 ui-md-10 ui-lg-10">
					<p:commandLink rendered="#{atlasApp['app.logout'] != 'false'}"
					target="_self" title="#{bundle['header.cerrar']}"
					alt="#{bundle['header.cerrar']}" value="#{bundle['header.cerrar']}"
					onclick="logoutForm.submit();return false;" />
				</div>
			</div>

		</form>

	</div>
	<div class="ui-g">
		<div class="ui-g-12" align="center">
			<h:outputText style="color:white"
				value="#{bundle['layout.CM']} - #{bundle['footer.version']} #{atlasApp['app.version']} - #{atlasApp['app.version.fecha']} - Atlas #{systemInfoBean.version}" />
		</div>
	</div>


</ui:composition>
