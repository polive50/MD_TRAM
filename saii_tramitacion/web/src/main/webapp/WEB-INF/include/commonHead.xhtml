<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml" xml:lang="es"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <f:loadBundle basename="conf/application" var="atlasApp" />
    <f:loadBundle basename="#{bundle['bundle.iconos']}" var="icon"/>
    <base href="#{faces.requestBaseURL}" />

    <link type="text/css" rel="stylesheet" href="css/fontawesome/all.css" />
    <link type="text/css" rel="stylesheet" href="css/atlas.css" />
    <link type="text/css" rel="stylesheet" href="atlas.core.css/atlasCore.css" />
    <link type="text/css" rel="stylesheet" href="atlas.core.css/atlas_layout.css" />
    <link type="text/css" rel="stylesheet" href="atlas.resources.css/atlaspSkin.css" />
    <title><h:outputText value="#{atlasApp['app.resources.name']} - #{bundle['layout.madrid']}" escape="false" /></title>

    <meta http-equiv="Content-Type" content="text/xhtml;charset=UTF-8" />
    <meta http-equiv="Content-Language" content="es" />
    <meta http-equiv="Language" name="language" content="es" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="Description" content="#{bundle['layout.title']}" />
    <meta name="Keywords" content="#{bundle['layout.CM']}" />
    <meta name="Author" content="#{bundle['layout.CM']}" />
    <meta name="Owner" content="#{bundle['layout.madridUrl']}" />
    <meta name="viewport" content="width=device-width" />
    <link rel="SHORTCUT ICON" href="#{icon['icono.favicon']}" />

    <!-- Recursos propios de la aplicación -->
    <ui:insert name="headerInsert">
        <link type="text/css" rel="stylesheet"
            href="css/#{atlasApp['app.resources.name']}.css" />
        <script type="text/javascript" src="js/#{atlasApp['app.resources.name']}.js"></script>
    </ui:insert>
</ui:composition>
