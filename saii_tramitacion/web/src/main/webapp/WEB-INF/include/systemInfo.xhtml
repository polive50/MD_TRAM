<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <h:panelGroup styleClass="info-fecha" layout="block">
        <h:outputText id="infoFecha" />
    </h:panelGroup>
    <p:panelGrid id="systemInfoTable" columns="1" layout="grid">
        <div>
            <span class="negrita">Cliente</span>
        </div>
        <h:panelGroup layout="block" styleClass="flexPanel info-par">
            <div class="info-label">
                <h:outputText value="System" />
            </div>
            <div class="info-value">
                <h:outputText id="infoOS" value="" />
            </div>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="flexPanel info-impar">
            <div class="info-label">
                <h:outputText value="Browser" />
            </div>
            <div class="info-value">
                <h:outputText id="infoBrowser" value="" />
            </div>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="flexPanel info-par">
            <div class="info-label">
                <h:outputText value="Java version" />
            </div>
            <div class="info-value">
                <h:outputText id="infoJava" value="" />
            </div>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="flexPanel info-impar">
            <div class="info-label">
                <h:outputText value="Acrobat Reader Version" />
            </div>
            <div class="info-value">
                <h:outputText id="infoAdobe" value="" />
            </div>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="flexPanel info-par">
            <div class="info-label">
                <h:outputText value="Client IP" />
            </div>
            <div class="info-value">
                <h:outputText value="#{systemInfoBean.clientIp}" />
            </div>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="flexPanel info-impar">
            <div class="info-label">
                <h:outputText value="Cookies enabled" />
            </div>
            <div class="info-value">
                <h:outputText id="infoCookies" value="" />
            </div>
        </h:panelGroup>
        <br />
        <br />
        <div>
            <span class="negrita">Headers</span>
        </div>
        <p:dataList value="#{systemInfoBean.headers}" var="item"
            rowIndexVar="row">
            <h:panelGroup layout="block"
                styleClass="flexPanel #{(row%2 == 1) ? 'info-impar' : 'info-par'}">
                <div class="info-label">
                    <h:outputText value="#{item.label}" />
                </div>
                <div class="info-value">
                    <h:outputText value="#{item.value}" />
                </div>
            </h:panelGroup>
        </p:dataList>
        <br />
        <br />

        <div>
            <span class="negrita">Cookies</span>
        </div>
        <p:dataList value="#{systemInfoBean.cookies}" var="item"
            rowIndexVar="row">
            <h:panelGroup layout="block"
                styleClass="flexPanel #{(row%2 == 1) ? 'info-impar' : 'info-par'}">
                <div class="info-label">
                    <h:outputText value="#{item.label}" />
                </div>
                <div class="info-value">
                    <h:outputText value="#{item.value}" />
                </div>
            </h:panelGroup>
        </p:dataList>
        <br />

        <div>
            <span class="negrita">Servidores</span>
        </div>
        <p:dataList value="#{systemInfoBean.servers}" var="item"
            rowIndexVar="row">
            <h:panelGroup layout="block"
                styleClass="flexPanel #{(row%2 == 1) ? 'info-impar' : 'info-par'}">
                <div class="info-label">
                    <h:outputText value="#{item.label}" />
                </div>
                <div class="info-value">
                    <h:outputText value="#{item.value}" />
                </div>
            </h:panelGroup>
        </p:dataList>
    </p:panelGrid>
</ui:composition>
