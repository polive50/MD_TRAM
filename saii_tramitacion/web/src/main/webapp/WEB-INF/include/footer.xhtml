<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <h:outputScript library="atlas.core.js" name="atlas-system-info.js" target="head"/>
    <h:outputScript library="atlas.core.js" name="atlas-system-info.js" target="head" />

    <div id="footer" class="main-footer atlas-layout">

        <div class="footer-left tablet-hide">
            <h:outputText styleClass="footer-content"
                value="#{bundle['footer.version']} #{atlasApp['app.version']} - #{atlasApp['app.version.fecha']}
                       #{bundle['footer.separator']} #{bundle['footer.copy']} &#169; #{bundle['footer.copy2']} - Atlas #{systemInfoBean.version}"/>
        </div>

        <div class="footer-central">
            <ui:insert name="footerCentral"/>
        </div>

        <div class="footer-right">
            <p:commandLink id="atlasAvisoSeguridad"
                onclick="PF('securityAdvice').show();return false;"
                styleClass="fa fa-fw fa-lock"
                title="#{systemInfoBean.getMessageByPolitica('avisoSeguridad.titulo')}"
                alt="#{systemInfoBean.getMessageByPolitica('avisoSeguridad.titulo')}"/>

            <p:commandLink id="atlasContacto"
                onclick="window.open('https://www.comunidad.madrid/solicitud-informacion','_blank');return false;"
                styleClass="fa fa-fw fa-envelope"
                title="contacto"
                alt="contacto"/>

            <p:commandLink id="atlasAvisoLegal"
                onclick="window.open('https://www.comunidad.madrid/servicios/informacion-atencion-ciudadano/aviso-legal-privacidad','_blank');return false;"
                styleClass="fa fa-fw fa-balance-scale"
                title="#{bundle['footer.link1']}"
                alt="#{bundle['footer.link1']}"/>

            <p:commandLink id="atlasInfoSystem"
                onclick="atlas.systemInfo.showPopup();PF('userDataPopup').show();return false;"
                styleClass="fa fa-fw fa-desktop tablet-hide"
                title="#{bundle['footer.link4']}"
                alt="#{bundle['footer.link4']}"/>
        </div>

    </div>

    <p:sidebar widgetVar="userDataPopup" styleClass="atlas-sliderbar" position="bottom" baseZIndex="0" style="display:none">
        <div id="footer-system atlas-layout">
            <ui:include src="/WEB-INF/include/systemInfo.xhtml" />
        </div>
    </p:sidebar>

    <!-- Debug de componentes de Richfaces/Primefaces/MyFaces -->
    <ui:debug id="myfacesLogViewer" hotkey="0" rendered="#{atlasEnv.get('log.atlas.myfaces.enabled', 'false')}"/>
    <p:log id="primefacesLogViewer"  rendered="#{atlasEnv.get('log.atlas.primefaces.enabled', 'false')}"/>

</ui:composition>
