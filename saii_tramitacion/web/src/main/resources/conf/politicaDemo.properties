#
# Fichero para la configuración de la política DEMO.
#  El formato expresado es el siguiente:
#    usuario=password;<lista_roles>;<enabled=true|false>;
#        <accountNonExpired=true|false>;<credentialsNonExpired=true|false>;<accountNonLocked=true|false>;
#        <OTRA_INFO=[clave=valor]
#  Donde
#    <lista_roles> es una lista de los roles de dicho usuario separados por coma
#
# Dejamos como ejemplo dos usuarios configurados: el usuario "admin" y el "usuario_ok",
#  con password "admin y "usuario_ok" respectivamente. Además ambos usuarios tienen los roles ROLE_1 y ROLE_2
#

#Rol 1 - Super Administrador
#Rol 2 - Administrador
#Rol 3 - Supervisor
#Rol 4 - Gestor
#Rol 5 - Auditor
#Rol 6 - Gestor Externo

SUPERADMIN=superadmin;ROLE_1;true;true;true;true;EMAIL=superadmin@localhost
ADMIN=admin;ROLE_2;true;true;true;true;EMAIL=admin@localhost
SUPERVISOR=supervisor;ROLE_3;true;true;true;true;EMAIL=supervisor@localhost
GESTOR=gestor;ROLE_4;true;true;true;true;EMAIL=gestor@localhost
AUDITOR=auditor;ROLE_5;true;true;true;true;EMAIL=auditor@localhost
E_GESTOR=externo;ROLE_6;true;true;true;true;EMAIL=gestorexterno@localhost

