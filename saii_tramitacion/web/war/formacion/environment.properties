######################################################
# Fichero de variables de configuración específicas  #
# para el entorno FORMACIÓN                          #
######################################################

# Configuración para acceso a base de datos
dataSourceName=saii_tramitacionDS

# Configuración de políticas de seguridad
politicaMaquinaFormacion=politicaUsuarioIntranet

# Activación/desactivación de auditoria de base de datos
auditoria.activar=false
# Enviará una traza de la auditoría al log sin llamar a los procedimientos de base de datos
auditoria.soloconsola=false
auditoria.triggers=false

# Ids de aplicacion
# Identificador de la aplicacion utilizado para las tablas de USU (intranet)
app.name=SAII
# Identificador de la aplicacion utilizado para tablas de USUI y UTUT (internet)

# Configuracion de log
monitor.FILE.directorioCliente=/usr/aplic_ICM/logs/saii_tramitacion
monitor.FILE.applicationId=saii_tramitacion
monitor.CONSOLE.threshold=INFO

# Si se necesita trazar alguna librería de ATLAS poner a Debug
log.root=info
log.atlas.todoAtlas=info
log.atlas.seguridad=info
log.atlas.fica=info
log.atlas.busquedas=info
log.atlas.clientews=info
log.atlas.axis2=info
log.atlas.rest=info
log.atlas.componentes=info
log.atlas.session.interceptor=info
log.atlas.auditar=info
log.atlas.iniciofin.request=info

#Nivel de log para las clases de esta aplicación
log.app=INFO

# Nivel de log las queries de Hibernate
log.hibernate=error

log.atlas.fin.request.basedatos=false

# Milisegundos a partir de los cuales las queries saldrÃ¡n en el log de queries lentas
log.slowquerys.milis=500

nombreDespliegue=${nombreDesplieguePom}

# Configuración para guardar el estado de la vista de JSF
javax.faces.STATE_SAVING_METHOD=client
org.apache.myfaces.COMPRESS_STATE_IN_CLIENT=true

#correo electronico
email.smtp.host=mail.madrid.org
email.smtp.user=
email.smtp.pass=
email.from=noresponder@madrid.org

# Tamaño máximo de fichero que se permite subir
uploadMaxFileSize=20m

# Configuración para el detalle de la página de error, posibles valores (none, message, trace)
error.detail=none

# Configuración proxy ICM para conexiones desde JAVA (Afecta a todas las apps del mismo contenedor)
atlas.proxycm.activo=false
atlas.proxycm.username=
atlas.proxycm.password=
atlas.proxycm.host=proxyservicios3c.madrid.org
atlas.proxycm.port=80
atlas.proxycm.isPassEncoded=false

# Configuración reCaptcha
atlas.recaptcha.privatekey=
atlas.recaptcha.publickey=

# Autorización del servicio de FICA
fica.grupoficheros=SAII
fica.modulotecnico=SAII_TRAMITACION
fica.password=