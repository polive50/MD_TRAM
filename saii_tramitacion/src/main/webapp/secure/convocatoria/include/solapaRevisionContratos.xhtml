<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <atlasp:guardarEstado
        value="#{documentoBean.motivoRechazoSeleccionado}" />
    <atlasp:guardarEstado
        value="#{documentoBean.formularioDocExternoDTO}" />
    <atlasp:guardarEstado value="#{documentoBean.documentoPtfrDTO}" />
    <atlasp:guardarEstado value="#{expedienteBean.expedienteDTO}" />
    <atlasp:guardarEstado value="#{documentoBean.activarBotonRequerimientoSubsanacion}" />
    <atlasp:guardarEstado value="#{documentoBean.activarBotonFinalizacionContratos}" />
    <atlasp:guardarEstado value="#{documentoBean.activarBotonDesistirExpediente}" />

    <atlasp:guardarEstado value="#{documentoBean.contratoSubir}" />
    
    <atlasp:guardarEstado value="#{expedienteBean.lstExpedienteConContrato}" />
    <atlasp:guardarEstado value="#{documentoBean.expedientePartiDTO}" />
    <atlasp:guardarEstado value="#{documentoBean.idExpedienteContratos}" />
    <atlasp:guardarEstado value="#{documentoBean.habilitarObservacionesContrato}" />
    <atlasp:guardarEstado value="#{expedienteBean.activarPestanaRevContrato}" />
   

    <p:panelGrid id="outpanelExpedienteDetalleParticipante" columns="1"
        columnClasses="ui-g-12" layout="grid"
        styleClass="ui-panelgrid-blank">
        
        <!-- Fecha Inicio contrato -->
        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
            <h:outputLabel for="fcInicioContratoExp"
                styleClass="label"
                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.revisionContratos.inicioMin']}" />
        </div>
        <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
            <p:calendar id="fcInicioContratoExp"
                readonlyInput="true" pattern="dd/MM/yyyy"
                readonly="true" showOn="none"
                value="#{expedienteBean.expedienteDTO.fcIniContrato}" />
        </div>
        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
            <h:outputLabel for="fcFinContratoExp"
                styleClass="label"
                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.revisionContratos.inicioMax']}" />
        </div>
        <div class="ui-g-12 ui-md-4 ui-lg-4 ui-xl-4">
            <p:calendar id="fcFinContratoExp"
                pattern="dd/MM/yyyy"
                value="#{expedienteBean.expedienteDTO.fcFinContrato}" />
                
        </div>
        <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
            <atlasp:button id="btnExtender" tipo="command"
                action="#{expedienteBean.extenderFechaContrato(expedienteBean.expedienteDTO)}"
                value="#{bundle['boton.contrato.extender']}"
                alt="#{bundle['boton.contrato.extender']}"
                title="#{bundle['boton.contrato.extender']}"
                tipoBoton="btn-warning"
                icon="fas fa-save"
                ajax="true"
                update="outpanelExpedienteDetalleParticipante"
                rendered="true"
                disabled="false"
                onclick="atlas.ui.Loading.showLoad('appLoading')"
                oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
            </atlasp:button>
        </div>
        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.detalleparticipantes.expedientes.contratos.titulo']}" />

        <atlasp:listaPaginada 
            
            id="tablaListaExpParticipante"
            
            listAndCountMethod="#{expedienteBean.obtenerTotalExpedienteConContrato}"
            export="true" exportTitle="Documentos"
            exportFile="Documentos"
            emptyMessage="No se encontraron registros" sortMode="single"
            reflow="true" pijama="true" editable="false" editMode="false">
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.cdExpediente']}"
                filtrable="false"
                exportable="true" filterMatchMode="exact">
                <ui:define name="value">
                    <h:outputText value="#{item.cdExpediente}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.dni']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.interesadoDTO.cdNumIden}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.nombreInteresado']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.interesadoDTO.dsNombre}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.apellido1Interesado']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.interesadoDTO.dsApellido1}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.label.apellido2Interesado']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.interesadoDTO.dsApellido2}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.inicio.contrato']}"
                filtrable="false"
                exportable="true">
                <ui:define name="value">
                    <h:outputText 
                        value="#{item.expedienteContrato.fcIniContrato}"
                        rendered="#{item.expedienteContrato.fcIniContrato != null}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.fin.contrato']}"
                filtrable="false"
                exportable="true">
                <ui:define name="value">
                    <h:outputText 
                        value="#{item.expedienteContrato.fcFinContrato}"
                        rendered="#{item.expedienteContrato.fcFinContrato != null}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy" />
                    </h:outputText>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <!--  Tipo Contrato  -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.tipo']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.expedienteContrato.idTipoContratoDTO.dsValor}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <!--  Indefinido  -->
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.indefinido']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.expedienteContrato.itIndefinido}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.estadoExpediente']}"
                filtrable="false"
                exportable="true" >
                <ui:define name="value">
                    <h:outputText value="#{item.expedienteContrato.idEstadoDTO.dsValor}"/>
                </ui:define>
            </atlasp:columnaListaPaginada>            
            
            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.acciones']}"
                filtrable="false" >

                <ui:define name="value">
                <atlasp:button ajax="false"
                        alt="#{bundle['convocatorias.detalle.solicitudes.label.consultarExpedientes']}"
                        title="#{bundle['convocatorias.detalle.solicitudes.label.consultarExpedientes']}"
                        icon="fas fa-search"
                        tipoBoton="btn-link"
                        render="outpanelDocumentosDetalleParticipante"
                        action="#{documentoBean.obtenerListaDocumentosExpedienteContratos(item)}"
                        ajaxUpdate="true"/>
                </ui:define>
            </atlasp:columnaListaPaginada>
        </atlasp:listaPaginada>
        
        <p:column>
        <atlasp:button id="btnSubSanar" tipo="command"
            action="#{documentoBean.enviarSubsanarContratosPortafirmas(convocatoriasBean.convocatoriaDTO)}"
            value="#{bundle['boton.enviar.portafirmaSub']}"
            alt="#{bundle['boton.enviar.portafirmaSub']}"
            title="#{bundle['boton.enviar.portafirmaSub']}"
            tipoBoton="btn-warning"
            icon="fas fa-paper-plane"
            ajax="true"
            update="outpanelExpedienteDetalleParticipante"
            rendered="#{documentoBean.activarBotonRequerimientoSubsanacion}"
            disabled="false"
            onclick="atlas.ui.Loading.showLoad('appLoading')"
            oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                 <f:facet name="events"> 
                    <p:confirm 
                         header="#{bundle['popup.confirmar.operacion.titulo']}"
                         message="#{bundle['popup.confirmar.pregunta.portafirmas']}"
                         icon="ui-icon-alert" />
                 </f:facet>
        </atlasp:button>
        <atlasp:button id="btnSubSanarDisable" tipo="command"
            value="#{bundle['boton.enviar.portafirmaSub']}"
            alt="#{bundle['boton.enviar.portafirmaSub']}"
            title="#{bundle['boton.enviar.portafirmaSub']}"
            tipoBoton="btn-warning"
            icon="fas fa-paper-plane"
            rendered="#{!documentoBean.activarBotonRequerimientoSubsanacion}"
            disabled="true"
            />
            
        </p:column>
    <p:panelGrid id="outpanelDocumentosDetalleParticipante" columns="1"
        columnClasses="ui-g-12" layout="grid"
        styleClass="ui-panelgrid-blank">
        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos']}" />
        
            <p:column>
                <div class="ui-g">
                
                    <!-- Código de expediente -->
                    <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                        <h:outputLabel for="cdExpedienteSel"
                            styleClass="label"
                            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.cdExpediente']}" />
                    </div>
                    <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
                        <p:inputText id="cdExpedienteSel"
                            readonly="true"
                            value="#{documentoBean.expedientePartiDTO.cdExpediente}" />
                    </div>
                    <!-- Fecha Inicio contrato -->
                    <div class="ui-g-3 ui-md-3 ui-lg-1 ui-xl-1">
                        <h:outputLabel styleClass="label"
                            for="fcIniContrato"
                            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.inicio']}" />
                    </div>
                    <div class="ui-g-4 ui-md-4 ui-lg-2 ui-xl-2">
                        <p:calendar
                                    id="fcIniContrato"
                                    value="#{documentoBean.expedientePartiDTO.expedienteContrato.fcIniContrato}"
                                    readonlyInput="true" pattern="dd/MM/yyyy"
                                    readonly="true" showOn="none"/>

                    </div>
                    <!-- Fecha Fin contrato -->
                    <div class="ui-g-3 ui-md-3 ui-lg-1 ui-xl-1">
                        <h:outputLabel styleClass="label"
                            for="fcFinContrato"
                            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.fin']}" />
                    </div>
                    <div class="ui-g-4 ui-md-4 ui-lg-2 ui-xl-2">
                        <p:calendar
                                    id="fcFinContrato"
                                    value="#{documentoBean.expedientePartiDTO.expedienteContrato.fcFinContrato}"
                                    readonlyInput="true" pattern="dd/MM/yyyy"
                                    readonly="true" showOn="none"/>                                    

                    </div>
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                         <!-- Tipo de contrato -->
                        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                            <h:outputLabel for="tipoContrato"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.tipo']}" />
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
                            <p:inputText id="tipoContrato"
                                readonly="true"
                                value="#{documentoBean.expedientePartiDTO.expedienteContrato.idTipoContratoDTO.dsValor}" />
                        </div>
                        <!-- Indefinido -->
                        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                            <h:outputLabel for="indefinido"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.indefinido']}" />
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-2 ui-xl-2">
                            <p:selectOneRadio value="#{documentoBean.expedientePartiDTO.expedienteContrato.itIndefinido}" id="indefinido"
                                class="radio-readonly" disabled="true">
                                <f:selectItem itemLabel="SI" itemValue="S" /> 
                                <f:selectItem itemLabel="NO" itemValue="N" />
                            </p:selectOneRadio>
                        </div>
                        <!-- Fecha Renuncia -->
                        <div class="ui-g-3 ui-md-3 ui-lg-1 ui-xl-1">
                            <h:outputLabel styleClass="label"
                                for="fcRenunciaContrato"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.renuncia']}" />
                        </div>
                        <div class="ui-g-4 ui-md-4 ui-lg-2 ui-xl-2">
                            <p:calendar id="fcRenunciaContrato"
                                readonlyInput="true" pattern="dd/MM/yyyy"
                                readonly="true" showOn="none"
                                value="#{documentoBean.expedientePartiDTO.expedienteContrato.fcRenuncia}" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                        <!-- Estado de expediente -->
                        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                            <h:outputLabel for="dsEstadoExpedienteSel"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.estado']}" />
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-7 ui-xl-7">
                            <p:inputText id="dsEstadoExpedienteSel"
                                readonly="true"
                                value="#{documentoBean.expedientePartiDTO.expedienteContrato.idEstadoRevAdminDTO.dsValor}" />
                        </div>
                    </div>
                    
                    
                    <!-- Estado de la revisió>n -->
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                        <div class="ui-g-12 ui-md-4 ui-lg-2 ui-xl-2">
                            <h:outputLabel value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.check']}"
                                filtrable="false" exportable="true"
                                width="15%">
                            </h:outputLabel>
                        </div>
                        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                            <p:selectOneRadio value="#{documentoBean.expedientePartiDTO.estadoRevision}" id="estadoRevisionNull"
                                rendered="#{documentoBean.habilitarRevisionContrato(1)}"
                                class="radio-readonly" disabled="true">
                                <f:selectItem itemLabel="OK" itemValue="OK" /> 
                                <f:selectItem itemLabel="Subsanar" itemValue="Subsanar" />
                            </p:selectOneRadio>
                            <p:selectOneRadio value="#{documentoBean.expedientePartiDTO.estadoRevision}" id="estadoRevision"
                            rendered="#{documentoBean.habilitarRevisionContrato(2)}">
                                <p:ajax update="outpanelDocumentosDetalleParticipante" 
                                        event="valueChange" listener="#{documentoBean.actualizarCalificacion(1)}" />
                                <f:selectItem itemLabel="OK" itemValue="OK" /> 
                                <f:selectItem itemLabel="Subsanar" itemValue="Subsanar" />
                            </p:selectOneRadio>
                            <p:selectOneRadio value="#{documentoBean.expedientePartiDTO.estadoRevision}" id="estadoRevisionKO"
                            rendered="#{documentoBean.habilitarRevisionContrato(3)}">
                                <p:ajax update="outpanelDocumentosDetalleParticipante" 
                                        event="valueChange" listener="#{documentoBean.actualizarCalificacion(1)}" />
                                <f:selectItem itemLabel="OK" itemValue="OK" /> 
                                <f:selectItem itemLabel="KO" itemValue="KO" />
                            </p:selectOneRadio>
                            <p:selectOneRadio value="#{documentoBean.expedientePartiDTO.estadoRevision}" id="estadoRevisionOK"
                            rendered="#{documentoBean.habilitarRevisionContrato(4)}">
                                <p:ajax update="outpanelDocumentosDetalleParticipante" 
                                        event="valueChange" listener="#{documentoBean.actualizarCalificacion(1)}" />
                                <f:selectItem itemLabel="OK" itemValue="OK" /> 
                            </p:selectOneRadio>
                        </div>
                    </div>
                    
                    <!-- Observaciones para el ciudadano -->
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                        <div class="ui-g-12 ui-md-4 ui-lg-2 ui-xl-2">
                            <h:outputLabel value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.contratos.observaciones.para.ciudadano']}"
                                filtrable="false" exportable="true"
                                width="15%">
                            </h:outputLabel>
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-7 ui-xl-7">
                            <p:inputTextarea maxlength="2000" rows="2"
                                value="#{documentoBean.tlObservacionesParaCiu}"
                                readonly="#{!documentoBean.habilitarRevisionContrato(5)}">
                            </p:inputTextarea>
                        </div>
                    </div>
                    
                    <!-- Observaciones del ciudadano -->
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                        <div class="ui-g-12 ui-md-4 ui-lg-2 ui-xl-2">
                            <h:outputLabel value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.contratos.observaciones.del.ciudadano']}"
                                for="observaciDelCiudadanoCont"
                                filtrable="false" exportable="true"
                                width="15%">
                            </h:outputLabel>
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-7 ui-xl-7">
                            <p:inputTextarea value="#{documentoBean.expedientePartiDTO.expedienteContrato.tlObservaciDelCiudadano}"
                                id="observaciDelCiudadanoCont"
                                maxlength="2000" rows="2"
                                readonly="true"/>
                        </div>
                    </div>
                </div>
            </p:column>
        
        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.documentos']}" />
        
        <atlasp:listaPaginada id="listaPaginadaExpedienteDocumentoContratosParticipante"
            listAndCountMethod="#{documentoBean.obtenerListaDocumentoExpedienteParticipante}"
            export="true" exportTitle="Documentos"
            exportFile="Documentos"
            emptyMessage="No se encontraron registros" sortMode="single"
            reflow="true" pijama="true" editable="false" editMode="false">

            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.tipo.documento.titulo']}"
                filtrable="false" exportable="true" editable="true">
                <ui:define name="value">

                    <f:facet name="output">
                        <!-- Documento -->
                        <h:outputText
                            value="#{item.expedienteDocDTO.tipoDocumentoDTO.dsValor}"
                            rendered="#{(item.expedienteDocDTO.tipoDocumentoDTO != null and item.expedienteDocDTO.tipoDocumentoDTO.idValor != null) and
                                    (!item.expedienteDocDTO.esDocumentoRequisito)}" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']}"
                            rendered="#{(item.expedienteDocDTO.tipoDocumentoDTO == null or item.expedienteDocDTO.tipoDocumentoDTO.idValor == null) and 
                                        (!item.expedienteDocDTO.esDocumentoRequisito) }" />

                        <!-- Documento de requisito-->
                        <h:outputText
                            value="#{item.expedienteDocDTO.tipoDocumentoDTO.dsValor} (#{item.expedienteDocDTO.dsDocumentoRequisito})"
                            rendered="#{(item.expedienteDocDTO.tipoDocumentoDTO != null and item.expedienteDocDTO.tipoDocumentoDTO.idValor != null) and 
                                        (item.expedienteDocDTO.esDocumentoRequisito) }" />
                        <h:outputText
                            value="#{bundle['revision.expediente.documento.tipo.documento.vacio']} (#{item.expedienteDocDTO.dsDocumentoRequisito})"
                            rendered="#{(item.expedienteDocDTO.tipoDocumentoDTO == null or item.expedienteDocDTO.tipoDocumentoDTO.idValor == null) and 
                                        (item.expedienteDocDTO.esDocumentoRequisito) }" />
                    </f:facet>
                    <f:facet name="input">
                        <h:selectOneMenu style="width: 180px!important"
                            valueChangeListener="#{documentoBean.changeListener}"
                            rendered="#{item.expedienteDocDTO.tipoDocumentoDTO.idValor eq null}">
                            <f:selectItems
                                value="#{documentoBean.obtenerListaAltaTipoDocumento}"
                                var="tipo" itemLabel="#{tipo.dsValor}"
                                itemValue="#{tipo.idValor}" />
                            <f:ajax
                                listener="#{documentoBean.cambiarTipoDocumento(item.expedienteDocDTO.idExpedienteDoc)}"
                                render="listaPaginadaExpedienteDocumentoContratosParticipante" />
                        </h:selectOneMenu>
                        <h:outputText
                            value="#{item.expedienteDocDTO.tipoDocumentoDTO.dsValor}"
                            rendered="#{item.expedienteDocDTO.tipoDocumentoDTO != null and item.expedienteDocDTO.tipoDocumentoDTO.idValor != null}" />
                    </f:facet>
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.fecha']}"
                field="fcModifFila" filtrable="false" exportable="true">
                <ui:define name="value">
                    <h:outputText
                        rendered="#{item.expedienteDocDTO.fcAltaFila != null and item.expedienteDocDTO.fcModifFila == null}"
                        value="#{item.expedienteDocDTO.fcAltaFila}"
                        styleClass="#{item.expedienteDocDTO.fcBajaFila == null ? '' : 'registroBaja'}">
                        <f:convertDateTime type="date"
                            pattern="dd/MM/yyyy - HH:mm:ss" />
                    </h:outputText>
                    <h:outputText
                        rendered="#{item.expedienteDocDTO.fcAltaFila != null and item.expedienteDocDTO.fcModifFila != null}"
                        value="#{item.expedienteDocDTO.fcModifFila}"
                        styleClass="#{item.expedienteDocDTO.fcBajaFila == null ? '' : 'registroBaja'}">
                        <f:convertDateTime type="date"
