<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

	<atlasp:guardarEstado value="#{expedienteBean.expedienteDTO}" />
    <atlasp:guardarEstado value="#{convocatoriasBean.convocatoriaDTO}" />
	<atlasp:guardarEstado value="#{convocatoriasBean.modoConsulta}" />

	<p:outputPanel id="outpanelPlazosExpSolapa">
    
     <!-- Formulario Contrato Inicial -->
    <div id="formContrIni">
		<div class="ui-g">
			<div class="ui-g-12">
				<h:outputText styleClass="tituloFormulario"
					value="#{bundle['convocatorias.detalle.solicitudes.expedientes.resolucion.label.tipo.contrato.inicial']}" />
				<div class="ui-g">
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                         <!-- Tipo de contrato -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="tipo"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.tipo']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:inputText id="tipoContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.idTipoContratoDTO.dsValor}" />
                        </div>
                        <!--  Identificador  -->
                        <div class="ui-g-12 ui-md-2 ui-lg-1 ui-xl-1">
                            <h:outputLabel for="identificadorContrato"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.identificador']}" />
                        </div>
                        <div class="ui-g-12 ui-md-4 ui-lg-3 ui-xl-3">
                            <p:inputText id="identificadorContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.interesadoDTO.cdNumIden}" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
                        <!--  Nombre  -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="nombreInteresadoContrato"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.nombre']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:inputText id="nombreInteresadoContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.interesadoDTO.dsNombre}" />
                        </div>
        
                        <!--  Apellido 1  -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="apellido1InteresadoContrato"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.apellido1']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:inputText id="apellido1InteresadoContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.interesadoDTO.dsApellido1}" />
                        </div>
        
                        <!--  Apellido 2  -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="apellido2InteresadoContrato"

                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:inputText id="apellido2InteresadoContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.interesadoDTO.dsApellido2}" />
                        </div>
                    </div>
                
                    <div class="ui-g-12 ui-md-12 ui-lg-12">
    					<!--  FECHA DE INICIO DE CONTRATO  -->
    					<div class="ui-g-12 ui-md-6 ui-lg-1">
    						<h:outputText styleClass="label"
    							value="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.inicio.contrato']}" />
    					</div>
    					<div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:calendar id="fechaInicioContratoInicial"
                                readonlyInput="true" pattern="dd/MM/yyyy"
                                readonly="true" showOn="none"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.fcIniContrato}" />
    						
    					</div>
    
    					<!--  FECHA FIN DE CONTRATO  -->
    					<div class="ui-g-12 ui-md-6 ui-lg-1">
    						<h:outputText styleClass="label"
    							value="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.fin.contrato']}" />
    					</div>
    					<div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:calendar id="fechaFinContratoInicial"
                                readonlyInput="true" pattern="dd/MM/yyyy"
                                readonly="true" showOn="none"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.fcFinContrato}" />

                       <!--  FECHA RENUNCIA  -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputText styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.plazos.label.fecha.renuncia.contrato']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:calendar id="fcRenunciaContratoInicial"
                                readonlyInput="true" pattern="dd/MM/yyyy"
                                readonly="true" showOn="none"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.fcRenuncia}" />
                            
    					</div>
                   </div>
                   <div class="ui-g-12 ui-md-12 ui-lg-12">
                         <!-- Estado -->
                         <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="estadoRevisionContrato"
                                styleClass="label"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.documentos.label.datos.estado']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:inputText id="estadoRevisionContratoInicial"
                                readonly="true"
                                value="#{expedienteBean.expedienteDTO.expedienteContrato.idEstadoDTO.dsValor}" />
                        </div>         
                        
                         <!-- Indefinido -->
                        <div class="ui-g-12 ui-md-6 ui-lg-1">
                            <h:outputLabel for="indefinidoContrato"
                                styleClass="label" 
                                readonlyInput="true"
                                readonly="true"
                                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.detalleParticipantes.contratos.indefinido']}" />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                            <p:selectOneRadio value="#{expedienteBean.expedienteDTO.expedienteContrato.itIndefinido}" 
                                class="radio-readonly"
                                disabled="true" id="indefinidoContraInicial">
                                <f:selectItem itemLabel="SI" itemValue="S" /> 
                                <f:selectItem itemLabel="NO" itemValue="N" />
                            </p:selectOneRadio>
                        </div>
                    </div>
				</div>
			</div>
		</div>
      
	   <p:spacer height="5" styleClass="tituloFormulario" />
	   
	   <atlasp:button action="#{expedienteBean.descargarContratoInicial(expedienteBean.expedienteDTO.idExpediente)}" 
	       rendered="true"
           update="outpanelPlazosExpSolapa"
           value="Descargar documentos"
		   alt="#{bundle['boton.descargar']}"
		   title="Descargar documentos"
           ajax="false"
		   icon="fas fa-download" tipoBoton="btn-warning">
		</atlasp:button>
      
      </div>
        
        <p:spacer height="5"/>
