<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">


    <!-- Historico -->
    <atlasp:listaPaginada id="lstHistorioTramite"
        listAndCountMethod="#{expedienteBean.obtenerHistoricoTramite}"
        reflow="true" pijama="true" sortMode="single" export="true"
        exportTitle="Historico_Expediente_Tramite"
        exportFile="Historico_Expediente_Tramite">

        <atlasp:columnaListaPaginada field="tramite" filtrable="false"
            exportable="true" order="false" label="Tramite">
            <ui:define name="value">
                <h:outputText value="#{item.tramiteDTO.dsValor}" />
            </ui:define>
        </atlasp:columnaListaPaginada>

        <atlasp:columnaListaPaginada field="interesado"
            filtrable="false" exportable="true" order="false"
            label="Interesado">
            <ui:define name="value">
               <h:outputText value="#{item.interesadoDTO.dsNombre} #{item.interesadoDTO.dsApellido1} #{empty item.interesadoDTO.dsApellido2 ? '' : item.interesadoDTO.dsApellido2}" />
            </ui:define>
        </atlasp:columnaListaPaginada>
        
        <atlasp:columnaListaPaginada field="fcAlta" filtrable="false"
            exportable="true" order="false" label="Fecha Alta">
            <ui:define name="value">
                <h:outputText value="#{item.fcAltaFila}">
                    <f:convertDateTime type="date"
                        pattern="dd/MM/yyyy - HH:mm:ss" />
                </h:outputText>
            </ui:define>
        </atlasp:columnaListaPaginada>
        

    </atlasp:listaPaginada>


</ui:composition>
