     <atlasp:guardarEstado value="#{expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciable}" /> 
    
    
    
    <p:outputPanel id="panelModifPresPlazoOtra">
    
        <!-- PANEL DE MODIFICACIONES PRESUP/PLAZOS/OTRAS -->
        <p:panelGrid columns="1" columnClasses="ui-g-12"
                styleClass="ui-panelgrid-blank" layout="grid">

            <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.modificacion.label.modifPresPlazoOtra']}" />

            <!-- Tabla Modificaciones P/P/O -->
            <atlasp:listaPaginada id="listaPaginadaModificaciones"
                listAndCountMethod="#{expedienteModifPresPlazoOtraBean.obtenerListaModificaciones}"
                sortMode="single" reflow="true" export="true" pijama="true"
                exportTitle="Modificaciones Presupuestarias Plazos y Otras" exportFile="ModificacionesPPO">
                
                    <!-- Id Modificacion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.idModificacion']}"
                        field="idModificacion" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText value="#{item.idModificacion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Fecha Solicitud -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.fechaSolicitud']}"
                        field="fcSolicitud" filtrable="false"
                        exportable="true" filterMatchMode="exact">
                        <p:calendar pattern="dd/MM/yyyy" mask="true"
                            styleClass="atlas-cal" locale="es_ES">
                        </p:calendar>
                        <ui:define name="value">
                            <h:outputText
                                value="#{Utiles.comprobarFechas(item.fcSolicitud) == true ? '' : item.fcSolicitud}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Modif Presup -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.modifPresup']}"
                        field="itModPres"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.itModPres == 'S' ? 'SI' : 'NO'}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Modif Plazo -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.modifPlazo']}"
                        field="itModPlazo"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.itModPlazo == 'S' ? 'SI' : 'NO'}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Modif Otra -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.modifOtra']}"
                        field="itModOtra"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.itModOtra == 'S' ? 'SI' : 'NO'}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Tipo Resolucion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.tipoResolucion']}"
                        field="estadoResolucionDTO.dsValor"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.estadoResolucionDTO.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Fecha Resolucion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.fechaResolucion']}"
                        field="fcResolucion"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <p:calendar pattern="dd/MM/yyyy" mask="true"
                            styleClass="atlas-cal" locale="es_ES">
                        </p:calendar>
                        <ui:define name="value">
                            <h:outputText
                                value="#{Utiles.comprobarFechas(item.fcResolucion) == true ? '' : item.fcResolucion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Estado -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.estado']}"
                        field="estadoDTO.dsValor"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.estadoDTO.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Acciones -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['listado.columna.acciones']}"
                        order="false" styleClass="acciones" width="10%">
                        <ui:define name="value">
                            <p:panelGrid columns="1" columnClasses="ui-g-12 text-center" layout="grid" styleClass="ui-panelgrid-blank">
                                <p:column>
                                    <atlasp:button 
                                        actionListener="#{expedienteModifPresPlazoOtraBean.verDetalleModif(item)}"
                                        ajax="false" alt="#{bundle['boton.ver.detalle']}"
                                        title="#{bundle['boton.ver.detalle']}"
                                        icon="fas fa-search"
                                        onclick="atlas.ui.Loading.showLoad('appLoading')"
                                        tipoBoton="btn-link" />
                                </p:column>
                            </p:panelGrid>
                        </ui:define>
                    </atlasp:columnaListaPaginada>
             </atlasp:listaPaginada>
        </p:panelGrid>
        
        <p:spacer height="10" />
        
        <div class="ui-g-12">
            <h:outputText styleClass="label negrita"
                value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.modificacion.idModificacion']} #{expedienteModifPresPlazoOtraBean.selectExpedienteModifDTO.idModificacion}:" 
                rendered="#{not empty expedienteModifPresPlazoOtraBean.selectExpedienteModifDTO and not empty expedienteModifPresPlazoOtraBean.selectExpedienteModifDTO.idModificacion}" />

        </div>
        
        <p:spacer height="10" />
        
       <!-- VMM 26/09/26 MD-3067: aviso fuera del fieldset (colapsable) para que se vea siempre, este
            desplegado o no el apartado. -->
       <p:outputPanel rendered="#{!expedienteModifPresPlazoOtraBean.existeModifPresupuestariaCargada()}">
           <i class="fa fa-exclamation-triangle" style="color:#b45309;margin-right:6px;" aria-hidden="true"></i>
           <h:outputText style="color:#b45309;font-weight:bold;"
               value="#{bundle['convocatorias.detalle.solicitudes.expedientes.modificacion.aviso.presupuesto.no.cargado']}" />
       </p:outputPanel>

       <!-- COLAPSABLE MODIFICACIONES PRESUPUESTARIAS -->
       <p:fieldset id="fsModifPresup"
            legend="#{bundle['convocatorias.detalle.solicitudes.expedientes.modificacion.label.modifPresupuestarias']}"
            collapsed="true" toggleable="true"
            rendered="#{not empty expedienteModifPresPlazoOtraBean.lstBloqueComponenteFila}">

 <!-- PRIMERA TABLA -->
          <!-- VMM 30/09/26 MD-3079: columnas dinamicas segun IT_MOSTRAR_AYUDA (isMostrarTablaAyudaFinan),
               igual que ya hace solapaFinanciacion.xhtml - la columna de "Ayuda Concedida" (2a columna)
               siempre existe en el DOM aunque este vacia, asi que con columnClasses fijo la tabla de
               presupuesto se quedaba siempre al 50% aunque la convocatoria no muestre ayuda. -->
          <p:panelGrid
            id="pgPresupuestoFinanciableAntesMod" columns="2"
            layout="grid" styleClass="ui-panelgrid-blank"
            columnClasses="#{expedienteModifPresPlazoOtraBean.isMostrarTablaAyudaFinan(1) ? 'ui-g-6 ui-md-6, ui-g-6 ui-md-6' : 'ui-g-12, ui-g-12'}" >
            
             <h:panelGroup>
                <h:outputText 
                   value="#{bundle['convocatorias.detalle.solicitudes.expedientes.modificacion.label.presAntesModif']} #{expedienteModifPresPlazoOtraBean.verNumeracion?1:':'}" 
                   style="font-weight: bold;text-transform: uppercase;"
                   rendered="#{!empty expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1}"/> 
                
                <!--   TP ANTES MODIF CON CONCEPTOS -->               
                <p:dataTable id="presupFinanciableAntesMod" var="presupFinanciable" 
                         value="#{expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1}"
                         sortBy="#{presupFinanciable.tipoFinanciacionDTO.ordenPartida}"
                         styleClass="atlas-lp"
                         rendered="#{!empty expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1 and expedienteModifPresPlazoOtraBean.esConvocatoriaConceptoPresup}">
                          
                <p:headerRow>
                    <p:column colspan="#{expedienteModifPresPlazoOtraBean.listaAnualidades.size() + 2}"
                              style="background-color: #E3EBF6 !important; text-align: left;">
                        <h:outputText value="#{presupFinanciable.tipoFinanciacionDTO.dsValor}"
                                      style="font-weight: bold; color: #2C3E50; text-transform: uppercase;"/>
                    </p:column>
                </p:headerRow>
             
                <p:column headerText="CONCEPTOS">
                    <h:outputText value="#{presupFinanciable.tlConcepto}" style="padding-left: 10px;" />
                    <f:facet name="footer">
                        <h:outputText value="TOTAL" style="font-weight:bold; color: black; display: block; text-align: left;" />
                    </f:facet>
                </p:column>
             
                <p:columns value="#{expedienteModifPresPlazoOtraBean.listaAnualidades}" var="anualidad" headerText="#{anualidad}º Anualidad">
                    <f:facet name="header">
                        <h:outputText value="#{anualidad}º Anualidad" />
                    </f:facet>
                
                    <p:inputNumber value="#{presupFinanciable.lstExpedienteModifPresupMontoDTO[anualidad].nmImporteConcedido}"
                                   rendered="#{!empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   symbol=" €" minValue="0" maxValue="9999999999.99" symbolPosition="s" 
                                   decimalSeparator="," thousandSeparator="." readonly="true" />
                
                    <p:inputNumber value="#{presupFinanciable.lstExpedientePresupMontoDTO[anualidad].nmImporte}"
                                   rendered="#{empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   symbol=" €" minValue="0" maxValue="9999999999.99" symbolPosition="s" 
                                   decimalSeparator="," thousandSeparator="." readonly="true" />
                
                    <f:facet name="footer">
                        <h:outputText value="#{expedienteModifPresPlazoOtraBean.getGranTotalVertical(anualidad, expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1)}" 
                                      style="font-weight:bold; color: black; display: block; text-align: left;">
                            <f:convertNumber type="currency" currencySymbol="€" locale="es_ES" />
                        </h:outputText>
                    </f:facet>
                </p:columns>
                
                <p:column headerText="TOTAL">
                    <p:inputNumber value="#{presupFinanciable.lstExpedienteModifPresupMontoDTO[presupFinanciable.lstExpedienteModifPresupMontoDTO.size() - 1].nmImporteConcedido}" 
                                   rendered="#{!empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   readonly="true" symbol=" €" symbolPosition="s" decimalSeparator="," thousandSeparator="."
                                   inputStyle="font-weight: bold; background: #F8F9FA;"/>
                                   
                    <p:inputNumber value="#{presupFinanciable.lstExpedientePresupMontoDTO[presupFinanciable.lstExpedientePresupMontoDTO.size() - 1].nmImporte}" 
                                   rendered="#{empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   readonly="true" symbol=" €" symbolPosition="s" decimalSeparator="," thousandSeparator="."
                                   inputStyle="font-weight: bold; background: #F8F9FA;"/>
                    
                    <f:facet name="footer">
                        <h:outputText value="#{expedienteModifPresPlazoOtraBean.getGranTotalFinal(expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1)}" 
                                      style="font-weight:bold; color: black; display: block; text-align: left;">
                            <f:convertNumber type="currency" currencySymbol="€" locale="es_ES" />
                        </h:outputText>
                    </f:facet>
                </p:column>
            
                <p:summaryRow rendered="#{presupFinanciable.tipoFinanciacionDTO.dsValor != 'TOTAL'}">
                    <p:column style="text-align: left; background-color: #F8F9FA;">
                        <h:outputText value="SUBTOTAL" style="font-weight: bold;" />
                    </p:column>
                
                    <p:column colspan="#{expedienteModifPresPlazoOtraBean.listaAnualidades.size()}" style="padding: 0px !important; background-color: #F8F9FA;">
                        <div style="display: flex; width: 100%;">
                            <ui:repeat value="#{expedienteModifPresPlazoOtraBean.listaAnualidades}" var="anualidad" varStatus="statusSub">
                                <div style="flex: 1; padding: 4px; text-align: center;">
                                    <p:inputNumber value="#{expedienteModifPresPlazoOtraBean.getSumaGrupo(presupFinanciable.tipoFinanciacionDTO, statusSub.index, expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1)}" 
                                                   readonly="true" symbol=" €" symbolPosition="s" decimalSeparator="," thousandSeparator="."
                                                   inputStyle="font-weight: bold; text-align: left; background: #E3EBF6 !important; width: 100%; border: 1px solid #ced4da; color: black !important;"/>
                                </div>
                            </ui:repeat>
                        </div>
                    </p:column>
                    
                    <p:column style="background-color: #F8F9FA;">
                        <p:inputNumber value="#{expedienteModifPresPlazoOtraBean.getSumaTotalGrupo(presupFinanciable.tipoFinanciacionDTO, expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1)}" 
                                       readonly="true" symbol=" €" symbolPosition="s" decimalSeparator="," thousandSeparator="."
                                       inputStyle="font-weight: bold; text-align: left; background: #ffffff !important; border: 1px solid #ced4da;"/>
                    </p:column>
                </p:summaryRow>
            </p:dataTable>

          
            <!--  TP ANTES MODIF SIN CONCEPTOS    -->
            <p:dataTable id="presupPresentadoModif" var="presupFinanciable" styleClass="atlas-lp"
                     value="#{expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1}"
                     rowIndexVar="rowIndex"
                     rendered="#{!empty expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1 and !expedienteModifPresPlazoOtraBean.esConvocatoriaConceptoPresup}">
                                             
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="2" headerText="" style="width: 45%;" />
                        <p:repeat var="anualidad" value="#{expedienteModifPresPlazoOtraBean.listaAnualidades}">
                            <p:column headerText="#{anualidad}° Anualidad" />
                        </p:repeat>
                        <p:column rowspan="2" headerText="TOTAL" />
                    </p:row>
                </p:columnGroup>

                <p:column style="width: 45%;">
                    <h:outputText value="#{presupFinanciable.tipoFinanciacionDTO.dsValor}" />
                </p:column>

                <p:columns value="#{expedienteModifPresPlazoOtraBean.listaNcolPresupuesto}" var="nCol" columnIndexVar="colIndex">
                    <p:inputNumber value="#{presupFinanciable.lstExpedienteModifPresupMontoDTO[nCol].nmImporteConcedido}"
                                   rendered="#{!empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   symbol=" €" minValue="0" maxValue="9999999999.99" symbolPosition="s"
                                   decimalSeparator="," thousandSeparator="." readonly="true" />

                    <p:inputNumber value="#{presupFinanciable.lstExpedientePresupMontoDTO[nCol].nmImporte}"
                                   rendered="#{empty presupFinanciable.lstExpedienteModifPresupMontoDTO}"
                                   symbol=" €" minValue="0" maxValue="9999999999.99" symbolPosition="s"
                                   decimalSeparator="," thousandSeparator="." readonly="true" />
                </p:columns>
            </p:dataTable>
                
            </h:panelGroup>
                
        
            <!-- AYUDA CONCEDIDA (antes modif) -->
            <h:panelGroup>
                <h:outputText
                    value="#{bundle['convocatorias.detalle.solicitudes.expedientes.label.financiacion.ayudaConcedida']}"
                    rendered="#{!empty expedienteModifPresPlazoOtraBean.lstPresupuestoFinanciableAntesMod1 and 
                        expedienteModifPresPlazoOtraBean.isMostrarTablaAyudaFinan(1)}"
                    style="font-weight: bold;text-transform: uppercase;" />
                
                <p:dataTable id="presupAyudaConcedidaAntesMod"
