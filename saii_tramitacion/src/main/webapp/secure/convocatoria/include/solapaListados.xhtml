<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

    <p:panelGrid id="outpanelListadosSolapa" columns="1"
        columnClasses="ui-g-12" layout="grid"
        styleClass="ui-panelgrid-blank">
        <h:outputText styleClass="tituloFormulario"
            value="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.listados.titulo']}"/>
            
         <atlasp:message tipo="info"
              texto="#{bundle['mensaje.descargar.listados.convocatoria']}"
              rendered ="#{!listadosBean.bloquearDescarga}"/> 
         
        <atlasp:listaPaginada id="listaPaginadaListados"
            listAndCountMethod="#{listadosBean.obtenerListaListados}"
            sortMode="single"
            reflow="true" export="true" exportTitle="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.informes.titulo']}"
            exportFile="#{bundle['convocatorias.detalle.solicitudes.expedientes.revision.label.informes.titulo']}">

            <atlasp:columnaListaPaginada
                label="#{bundle['convocatorias.detalle.listados.label.titulo']}"
                field="dsTitulo" filtrable="false" exportable="true"
                filterMatchMode="exact" width="90%">
                <ui:define name="value">
                    <h:outputText value="#{item.dsTitulo}"
                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                </ui:define>
            </atlasp:columnaListaPaginada>

            <atlasp:columnaListaPaginada
                label="#{bundle['listado.columna.acciones']}" order="false"
                styleClass="acciones" width="10%" >
                <ui:define name="value">
                    <div class="ui-g">
                        <div class="ui-g-4 ui-md-4 ui-lg-4">
                            <atlasp:button
                                action="#{listadosBean.descargarExcel(item.idListado)}"
                                rendered="#{listadosBean.bloquearDescarga}"
                                ajax="false"
                                alt="#{bundle['boton.descargar']}"
                                title="#{bundle['boton.descargar']}"
                                icon="fas fa-download" tipoBoton="btn-link">
                            </atlasp:button>
                        </div>
                    </div>
                </ui:define>
            </atlasp:columnaListaPaginada>
        </atlasp:listaPaginada>
        
    </p:panelGrid>
</ui:composition>
