<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:atlasp="http://atlas.core.componentes/jsf/composite-p">

<head>
<title value="#{bundle['convocatorias.convocatorias.titulo']}"></title>
</head>


<ui:composition template="/WEB-INF/layout/atlasBaseLayout.xhtml">

    <ui:param name="appLoadingOnLoadPage" value="true" />
    
    <ui:define name="titulo">
        <h:outputText styleClass="subtituloPagina"
            value="#{bundle['inicio.label.convocatorias.titulo']}" />
    </ui:define>
    
    <ui:define name="content">
        <h:form id="listaConvocatoriaForm" styleClass="form-atlas">
            <atlasp:guardarEstado
                value="#{convocatoriasBean.catalogoValoresDireccionSelec}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.catalogoValoresSubDireccionSelec}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.catalogoValoresLineaAyudaSelec}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.catalogoValoresAreaAdministrativaSelec}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.cdAcronimoFilter}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.dsDescripcionFilter}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.idModalidadConvocatoriaFilter}" />
            <atlasp:guardarEstado value="#{convocatoriasBean.filtros}" />
            <atlasp:guardarEstado
                value="#{convocatoriasBean.nmAnoFilter}" />

            <h:outputText styleClass="tituloFormulario"
                value="#{bundle['listados.filtros']}" />

            <p:outputPanel id="outputPanelFormFilterConvocatoria">
                <div class="ui-g">
                    <!-- Dirección General-->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.direccion']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11 mtb-auto">
                        <atlasp:listaValores id="listaDireccion"
                            disabled="#{infoUsuarioBean.nvlDireccion}"
                            rows="10"
                            render="outputPanelFormFilterConvocatoria"
                            modoUso="custom"
                            listMethod="#{convocatoriasBean.obtenerListaDireccionFiltro}"
                            countMethod="#{convocatoriasBean.obtenerTotalListaDireccionFiltro}"
                            inputRenderMode="suggestion"
                            inputColumn="dsUnidad"
                            titulo="Dirección General"
                            value="#{convocatoriasBean.catalogoValoresDireccionSelec}"
                            selectListener="#{convocatoriasBean.convertirGentiadminAUnidadAdminDireccion}">
                            <f:facet name="columns">
                                <atlasp:columnaListaValores
                                    campoBD="cdUnidad"
                                    label="#{bundle['convocatorias.label.unidad']}" />
                                <atlasp:columnaListaValores
                                    campoBD="dsUnidad"
                                    filtroPorDefecto="true"
                                    label="#{bundle['convocatorias.label.direccion']}" />
                            </f:facet>
                        </atlasp:listaValores>
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpDireccion"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.label.direccion.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.direccion.tooltipForm']}" />
                        <p:tooltip for="helpDireccion" escape="false"
                            value="#{bundle['convocatorias.detalle.label.direccion.tooltipForm']}" />
                    </div>
                </div>
                <div class="ui-g">
                    <!-- Subdireccion -->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.subdireccion']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11 mtb-auto">
                        <atlasp:listaValores id="listaSubdireccion"
                            disabled="#{infoUsuarioBean.nvlSubDireccion}"
                            rows="10"
                            render="outputPanelFormFilterConvocatoria"
                            modoUso="custom"
                            listMethod="#{convocatoriasBean.obtenerListaSubdireccionFiltro}"
                            countMethod="#{convocatoriasBean.obtenerTotalListaSubdireccionFiltro}"
                            inputRenderMode="suggestion"
                            inputColumn="dsUnidad" titulo="Subdirección"
                            value="#{convocatoriasBean.catalogoValoresSubDireccionSelec}"
                            selectListener="#{convocatoriasBean.convertirGentiadminAUnidadAdminSubDireccion}">
                            <f:facet name="columns">
                                <atlasp:columnaListaValores
                                    campoBD="cdUnidad"
                                    label="#{bundle['convocatorias.label.unidad']}" />
                                <atlasp:columnaListaValores
                                    campoBD="dsUnidad"
                                    filtroPorDefecto="true"
                                    label="#{bundle['convocatorias.label.subdireccion']}" />

                            </f:facet>
                        </atlasp:listaValores>
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpSubdireccion"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.label.subdireccion.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.subdireccion.tooltipForm']}" />
                        <p:tooltip for="helpSubdireccion" escape="false"
                            value="#{bundle['convocatorias.detalle.label.subdireccion.tooltipForm']}" />
                    </div>
                </div>
                <div class="ui-g">
                    <!--Area administrativa -->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.areaAdministrativa']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11 mtb-auto">
                        <atlasp:listaValores
                            id="listaAreaAdministrativa"
                            disabled="#{infoUsuarioBean.nvlUnidadAdmin}"
                            rows="10"
                            render="outputPanelFormFilterConvocatoria"
                            modoUso="custom"
                            listMethod="#{convocatoriasBean.obtenerListaAreaAdministrativaFiltro}"
                            countMethod="#{convocatoriasBean.obtenerTotalAreaAdministrativaFiltro}"
                            inputRenderMode="suggestion"
                            inputColumn="dsUnidad"
                            titulo="Área administrativa"
                            value="#{convocatoriasBean.catalogoValoresAreaAdministrativaSelec}">
                            <f:facet name="columns">
                                <atlasp:columnaListaValores
                                    campoBD="cdUnidad"
                                    label="#{bundle['convocatorias.label.unidad']}" />
                                <atlasp:columnaListaValores
                                    campoBD="dsUnidad"
                                    filtroPorDefecto="true"
                                    label="#{bundle['convocatorias.label.areaAdministrativa']}" />

                            </f:facet>
                        </atlasp:listaValores>

                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpAreaAdmin"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.label.areaAdministrativa.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.areaAdministrativa.tooltipForm']}" />
                        <p:tooltip for="helpAreaAdmin" escape="false"
                            value="#{bundle['convocatorias.detalle.label.areaAdministrativa.tooltipForm']}" />
                    </div>
                </div>
                <div class="ui-g">
                    <!--Linea de ayuda -->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.lineaAyuda']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11 mtb-auto">
                        <atlasp:listaValores id="listaLineaAyuda"
                            disabled="#{!infoUsuarioBean.tieneSubDirOUnidad}"
                            rows="10"
                            render="outputPanelFormFilterConvocatoria"
                            modoUso="custom"
                            listMethod="#{filtroBean.obtenerListaLineasAyudaFiltro}"
                            countMethod="#{filtroBean.obtenerTotalLineasAyudaFiltro}"
                            inputRenderMode="suggestion"
                            inputColumn="dsValor"
                            titulo="Línea de Ayuda"
                            value="#{convocatoriasBean.catalogoValoresLineaAyudaSelec}">
                            <f:facet name="columns">
                                <atlasp:columnaListaValores
                                    campoBD="idValor" label="Id"
                                    mostrarColumna="false"
                                    mostrarEnFiltro="false" />
                                <atlasp:columnaListaValores
                                    campoBD="dsValor"
                                    filtroPorDefecto="true"
                                    label="#{bundle['convocatorias.label.valor']}" />

                            </f:facet>
                        </atlasp:listaValores>
                        <p:outputPanel
                            styleClass="icono fa fa-fw fa-question-circle"
                            id="helpLineaAyuda"
                            value="#{icon['icono.ayuda']}"
                            alt="#{bundle['convocatorias.detalle.label.lineaAyuda.tooltipForm']}"
                            title="#{bundle['convocatorias.detalle.label.lineaAyuda.tooltipForm']}" />
                        <p:tooltip for="helpLineaAyuda" escape="false"
                            value="#{bundle['convocatorias.detalle.label.lineaAyuda.tooltipForm']}" />
                    </div>
                </div>

                <div class="ui-g">
                    <div class="ui-g-12 ui-md-6 ui-lg-6 ui-xl-3 p-0">
                        <div class="ui-g">
                            <!-- Acronimo y Plazos -->
                            <div
                                class="ui-g-12 ui-md-4 ui-lg-4 ui-xl-4 mtb-auto">
                                <h:outputText styleClass="label"
                                    value="#{bundle['convocatorias.label.acronimo']}" />
                            </div>
                            <div
                                class="ui-g-12 ui-md-6 ui-lg-6 ui-xl-6 mtb-auto">
                                <p:inputText maxlength="10"
                                    disabled="#{!infoUsuarioBean.tieneSubDirOUnidad}"
                                    value="#{convocatoriasBean.cdAcronimoFilter}" />
                                <p:outputPanel
                                    styleClass="icono fa fa-fw fa-question-circle"
                                    id="helpAcronimo"
                                    value="#{icon['icono.ayuda']}"
                                    alt="#{bundle['convocatorias.detalle.label.acronimo.tooltipForm']}"
                                    title="#{bundle['convocatorias.detalle.label.acronimo.tooltipForm']}" />
                                <p:tooltip for="helpAcronimo"
                                    escape="false"
                                    value="#{bundle['convocatorias.detalle.label.acronimo.tooltipForm']}" />
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-6 ui-lg-6 ui-xl-2 p-0">
                        <div class="ui-g">
                            <!-- Año -->
                            <div
                                class="ui-g-12 ui-md-2 ui-lg-3 ui-xl-4 mtb-auto">
                                <h:outputText styleClass="label"
                                    value="#{bundle['convocatorias.label.anio']}" />
                            </div>
                            <div
                                class="ui-g-12 ui-md-4 ui-lg-4 ui-xl-6 mtb-auto">
                                <p:inputNumber minValue="0"
                                    maxValue="9999" thousandSeparator=""
                                    decimalPlaces="0"
                                    value="#{convocatoriasBean.nmAnoFilter}"
                                    disabled="#{!infoUsuarioBean.tieneSubDirOUnidad}">
                                </p:inputNumber>
                                <p:outputPanel
                                    styleClass="icono fa fa-fw fa-question-circle"
                                    id="helpAnio"
                                    value="#{icon['icono.ayuda']}"
                                    alt="#{bundle['convocatorias.detalle.label.anio.tooltipForm']}"
                                    title="#{bundle['convocatorias.detalle.label.anio.tooltipForm']}" />
                                <p:tooltip for="helpAnio" escape="false"
                                    value="#{bundle['convocatorias.detalle.label.anio.tooltipForm']}" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ui-g">
                    <!--  Descripción  -->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.descripcion']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-10 ui-lg-10 ui-xl-11 mtb-auto">
                        <p:outputPanel id="dsDescripcion">
                            <p:inputText maxlength="2000"
                                value="#{convocatoriasBean.dsDescripcionFilter}"
                                disabled="#{!infoUsuarioBean.tieneSubDirOUnidad}" />
                            <p:outputPanel
                                styleClass="icono fa fa-fw fa-question-circle"
                                id="helpDescripcion"
                                value="#{icon['icono.ayuda']}"
                                alt="#{bundle['convocatorias.detalle.label.descripcion.tooltipForm']}"
                                title="#{bundle['convocatorias.detalle.label.descripcion.tooltipForm']}" />
                            <p:tooltip for="helpDescripcion"
                                value="#{bundle['convocatorias.detalle.label.descripcion.tooltipForm']}" />
                        </p:outputPanel>
                    </div>
                </div>
                <div class="ui-g">
                    <!-- Modalidad Convocatoria -->
                    <div
                        class="ui-g-12 ui-md-2 ui-lg-2 ui-xl-1 mtb-auto">
                        <h:outputText styleClass="label"
                            value="#{bundle['convocatorias.label.modalidadConvocatoria']}" />
                    </div>
                    <div
                        class="ui-g-12 ui-md-6 ui-lg-5 ui-xl-4 mtb-auto">
                        <p:outputPanel id="modalidadConvocatoria">
                            <atlasp:comboValores id="idModalidad"
                                enableManualInput="false"
                                listWidth="300px"
                                recargaAutomatica="false"
                                externalProvider="#{comboBean.comboModalidadConvocatoria}"
                                value="#{convocatoriasBean.idModalidadConvocatoriaFilter}"
                                selectListener="#{convocatoriasBean.cambioModalidad}"
                                disabled="#{!infoUsuarioBean.tieneSubDirOUnidad}">
                            </atlasp:comboValores>
                            <p:outputPanel
                                styleClass="icono fa fa-fw fa-question-circle"
                                id="helpModalidadConvocatoria"
                                value="#{icon['icono.ayuda']}"
                                alt="#{bundle['convocatorias.detalle.label.modalidadConvocatoria.tooltipForm']}"
                                title="#{bundle['convocatorias.detalle.label.modalidadConvocatoria.tooltipForm']}" />
                            <p:tooltip for="helpModalidadConvocatoria"
                                escape="false"
                                value="#{bundle['convocatorias.detalle.label.modalidadConvocatoria.tooltipForm']}" />
                        </p:outputPanel>
                    </div>
                </div>
            </p:outputPanel>

            <div class="space" />

            <atlasp:facesMessages id="listaConvocatoriasMessages"
                modo="todo" escape="false" />

            <div class="space" />

            <!-- Botones de filtro de convocatoria -->
            <ui:fragment id="botoneraListaConvocatoria"
                rendered="#{infoUsuarioBean.tieneSubDirOUnidad}">
                <atlasp:button
                    action="#{convocatoriasBean.filtrarListaConvocatorias}"
                    ajax="true"
                    execute="outputPanelFormFilterConvocatoria"
                    render="panelResultados"
                    value="#{bundle['boton.filtrar']}"
                    alt="#{bundle['boton.filtrar']}"
                    title="#{bundle['boton.filtrar']}"
                    icon="fas fa-filter" tipoBoton="btn-primary"
                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                </atlasp:button>
                <atlasp:button
                    action="#{convocatoriasBean.borrarFiltros}"
                    ajax="false" execute="@this"
                    render="outputPanelFormFilterConvocatoria panelResultados"
                    value="#{bundle['boton.borrarFiltros']}"
                    alt="#{bundle['boton.borrarFiltros']}"
                    title="#{bundle['boton.borrarFiltros']}"
                    icon="fas fa-ban" tipoBoton="btn-secondary"
                    onclick="atlas.ui.Loading.showLoad('appLoading')"
                    oncomplete="atlas.ui.Loading.hideLoad('appLoading')">
                </atlasp:button>
            </ui:fragment>

            <p:spacer height="5" styleClass="tituloFormulario"
                rendered="#{infoUsuarioBean.tieneSubDirOUnidad}" />

            <!-- Lista de convocatorias -->
            <h:panelGroup id="panelResultados" layout="block">
                <atlasp:listaPaginada id="listaPaginadaConvocatoria"
                    listAndCountMethod="#{convocatoriasBean.obtenerListaConvocatorias}"
                    filtro="#{convocatoriasBean.filtros}"
                    sortMode="single" reflow="true" export="true"
                    exportTitle="Convocatoria" exportFile="Convocatoria"
                    rendered="#{infoUsuarioBean.tieneSubDirOUnidad}">
                    <!-- Acronimo -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.acronimo']}"
                        field="cdAcronimo" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText value="#{item.cdAcronimo}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Anio -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.anio']}"
                        field="nmAno" filtrable="false"
                        exportable="true" filterMatchMode="exact">
                        <ui:define name="value">
                            <h:outputText value="#{item.nmAno}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>
                    <!-- Direccion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.direccion']}"
                        field="idDireccion.dsUnidad"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.idDireccion.dsUnidad}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Subdireccion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.subdireccion']}"
                        field="idSubdireccion.dsUnidad"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.idSubdireccion.dsUnidad}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>


                    <!-- Area administrativa -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.areaAdministrativa']}"
                        field="idAreaAdministrativa.dsUnidad"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.idAreaAdministrativa.dsUnidad}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Linea ayuda -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.lineaAyuda']}"
                        field="idLineaAyuda.dsValor" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.idLineaAyuda.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Plazo desde -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.plazoDesde']}"
                        field="fcIniPresentacion" filtrable="false"
                        exportable="true" filterMatchMode="exact">
                        <p:calendar pattern="dd/MM/yyyy" mask="true"
                            styleClass="atlas-cal" locale="es_ES">
                        </p:calendar>
                        <ui:define name="value">
                            <h:outputText
                                value="#{Utiles.comprobarFechas(item.fcIniPresentacion) == true ? '' : item.fcIniPresentacion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Plazo hasta -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.plazoHasta']}"
                        field="fcFinPresentacion" filtrable="false"
                        exportable="true" filterMatchMode="exact">
                        <p:calendar pattern="dd/MM/yyyy" mask="true"
                            styleClass="atlas-cal" locale="es_ES">
                        </p:calendar>
                        <ui:define name="value">
                            <h:outputText
                                value="#{Utiles.comprobarFechas(item.fcFinPresentacion) == true ? '' : item.fcFinPresentacion}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Convocatoria activa -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.convocatoriaActiva']}"
                        field="itConvocatoriaActiva" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.itConvocatoriaActiva == 'S' ? 'SI' : 'NO'}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Descripcion -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.descripcion']}"
                        field="dsDescripcion" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.dsDescripcionCorta}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>

                    </atlasp:columnaListaPaginada>

                    <!-- Modalidad convocatoria -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.modalidadConvocatoria']}"
                        field="idModalidadConvocatoria.dsValor"
                        filtrable="false" exportable="true"
                        filterMatchMode="startWith">
                        <ui:define name="value">
                            <h:outputText
                                value="#{item.idModalidadConvocatoria.dsValor}"
                                styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                        </ui:define>
                    </atlasp:columnaListaPaginada>

                    <!-- Estados -->
                    <atlasp:columnaListaPaginada
                        label="#{bundle['convocatorias.label.estado']}"
                        field="idEstado.dsValor" filtrable="false"
                        exportable="true" filterMatchMode="startWith">
                        <ui:define name="value">
                            <div class="ui-g text-center">
                                <div class="ui-g-12 ui-md-12 ui-lg-12">
                                    <h:outputText
                                        value="#{item.idEstado.dsValor}"
                                        styleClass="#{item.fcBajaFila == null ? '' : 'registroBaja'}" />
                                </div>
                                <div class="ui-g-12 ui-md-12 ui-lg-12">
                                    <p:outputPanel
                                        id="idAlertaTramitesPendiente"
                                        rendered="#{item.alertaTramitesPendiente>0}"
                                        styleClass="panel-alerta"
                                        alt="#{bundle['listado.columna.consultar']}"
                                        title="#{bundle['listado.columna.consultar']}">
                                        <span class="fa-layers fa-fw">
                                            <i
                                            class="fas fa-bell icon-parent atlasContenidoColorAzul" />
