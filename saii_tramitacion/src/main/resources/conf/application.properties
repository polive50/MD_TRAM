######################################################

# Configuracion para el menu de la aplicacion
MENU_XML_FILE=/menu.xml

# Configuracion de urls de aplicacion
app.url.porDefecto=/secure/index.jsf?id=1
app.url.noAutorizado=/login.jsf
app.url.login=/login.jsf
app.url.logout=/logout.jsf
app.url.cert.error=/errorPages/certificadoErroneo.jsf
# A esta página se redirige cuando el certificado es válido pero el usuario no está autorizado a ver la url solicitada.
app.url.cert.noAutorizado=/errorPages/certificadoNoAutorizado.jsf
# Urls de error
app.url.errores.4XX=/errorPages/error400.jsf
app.url.errores.5XX=/errorPages/error500.jsf
app.url.errores.sesionExpirada=/errorPages/sesionExpirada.jsf

# Nombre del fichero CSS general de Atlas
app.atlas.css=atlas.css

# Configuración para mostrar o no el usuario contectado y el botón de logout en la cabecera
app.userInfo=true
app.logout=true
# Si userInfo está a true se tiene en cuenta empresaInfo, con lo que se mostrará el CIF de la empresa en caso
# de entrar por certificado de persona juridica
app.empresaInfo=false

# Nombre de los ficheros de estilos y javascript propios de la aplicación
app.resources.name=saii_tramitacion

# Version actual de la aplicacion
app.version=${project.version}

# Fecha de creacion de la version actual de la aplicacion
app.version.fecha=${fechaCreacion}

#Indica si el manejador de excepciones AJAX está habilidado (redirecciona a la página de error)
atlas.ajaxExceptionHander.enabled=true

#Indica si se han de ignorar las navegaciones que se realicen a la página actual a través de una petición AJAX
atlas.ajaxNavigationHander.ignorarNavegacionPaginaActual=true

hibernate.packagesToScan=atlas.core.seguridad.domain,\
                    atlas.componentes.domain,\
                    org.madrid.saii.lib.domain,\
                    atlas.core.log.appender
hibernate.format_sql=false
hibernate.cache.debugListener=false
hibernate.use_sql_comments=false
hibernate.dialect=atlas.core.database.CustomDialect

# Datos de la aplicación
saii.codigo=SAII


